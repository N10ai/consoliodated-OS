<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consolidated OS</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#122033;--muted:#6f7b8d;--line:#e4e8ee;--nav:#0e1726;--blue:#2764e7;--blue2:#eaf1ff;--green:#16865a;--green2:#e8f7f0;--amber:#b66a0b;--amber2:#fff4df;--red:#c33e4a;--red2:#ffebed;--shadow:0 12px 36px rgba(20,34,55,.07)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:var(--nav);color:white;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:0 8px 24px;font-weight:850;font-size:19px;letter-spacing:-.03em}.brand small{display:block;margin-top:3px;color:#91a2bc;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:#1a2840;color:#fff}.main{padding:22px;min-width:0}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.eyebrow{font-size:11px;color:var(--blue);font-weight:850;text-transform:uppercase;letter-spacing:.1em}.title h1{margin:2px 0 3px;font-size:28px;letter-spacing:-.045em}.title p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:750}.btn:hover{border-color:#c5ceda}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:var(--blue2);border-color:transparent;color:var(--blue)}.btn.sm{padding:6px 9px;font-size:12px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:15px}.metric span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.metric strong{font-size:25px;display:block;margin-top:5px}.metric.alert strong{color:var(--red)}.panel{padding:17px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.panel h2{margin:0;font-size:16px;letter-spacing:-.02em}.subtle{color:var(--muted);font-size:12px}.split{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}.attention-list,.cutoffs,.house-list{display:grid;gap:9px}.attention{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px}.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--red2);color:var(--red);font-weight:900}.attention strong,.cutoff strong{display:block}.attention small,.cutoff small{color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:850;white-space:nowrap}.green{background:var(--green2);color:var(--green)}.amber{background:var(--amber2);color:var(--amber)}.red{background:var(--red2);color:var(--red)}.blue{background:var(--blue2);color:var(--blue)}.gray{background:#eef1f5;color:#5d6878}.cutoff{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.cutoff:last-child{border:0}.house{overflow:hidden}.house-head{padding:15px 16px;background:#fbfcfe;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.house-head h3{margin:0;font-size:16px}.house-meta{color:var(--muted);font-size:12px;margin-top:3px}.shipper{padding:14px 16px;border-bottom:1px solid var(--line)}.shipper:last-child{border:0}.shipper-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.shipper-title{font-weight:850}.wr-row{display:grid;grid-template-columns:105px 1fr 125px 135px 115px 80px;gap:8px;align-items:center;padding:9px 0;border-top:1px dashed #e7eaf0}.wr-row:first-of-type{border-top:0}.wr-id{color:var(--blue);font-weight:850;background:none;border:0;text-align:left;padding:0}.doc-dots{display:flex;gap:4px}.dot{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:900;background:#edf0f4;color:#8893a3}.dot.ok{background:var(--green2);color:var(--green)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;color:var(--ink)}.toolbar input{flex:1;min-width:200px}.queue-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.queue{padding:15px}.queue h3{margin:0 0 10px;font-size:14px}.task{padding:10px;border:1px solid var(--line);border-radius:11px;margin-top:8px}.task strong{display:block}.task small{color:var(--muted)}.task-actions{display:flex;gap:6px;margin-top:8px}.instruction-grid{grid-template-columns:330px 1fr}.template-list{display:grid;gap:8px}.template{border:1px solid var(--line);padding:11px;border-radius:11px;background:#fff;text-align:left}.template.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue2)}.template strong{display:block}.template small{color:var(--muted)}.preview{background:#101827;color:#e7edf7;border-radius:14px;padding:18px;min-height:320px;white-space:pre-wrap}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em}.drawer{position:fixed;inset:0 0 0 auto;width:min(680px,100%);background:#fff;z-index:30;box-shadow:-20px 0 60px rgba(20,34,55,.2);transform:translateX(100%);transition:.22s;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:18px}.section{margin-bottom:20px}.section h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#5f6d80}.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px}.note{background:#f7f9fc;border:1px solid var(--line);border-radius:11px;padding:11px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:11px 14px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;z-index:60}.toast.show{opacity:1;transform:none}.empty{padding:32px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:12px}.brand{padding:4px 8px 12px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center}.metrics{grid-template-columns:repeat(3,1fr)}.split,.instruction-grid{grid-template-columns:1fr}.queue-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.main{padding:14px}.top{flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.queue-grid{grid-template-columns:1fr}.wr-row{grid-template-columns:90px 1fr 90px}.wr-row>div:nth-child(4),.wr-row>div:nth-child(5),.wr-row>div:nth-child(6){display:none}.form-grid,.docs{grid-template-columns:1fr}.nav{overflow:auto;grid-template-columns:repeat(5,minmax(110px,1fr))}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Consolidated OS<small>Ocean daily operations</small></div><nav class="nav"><button class="active" data-view="today">Today</button><button data-view="houses">Houses</button><button data-view="warehouse">Warehouse</button><button data-view="instructions">Instructions</button><button data-view="setup">Setup</button></nav></aside><main class="main"><header class="top"><div class="title"><div class="eyebrow" id="eyebrow">EC-0815 · Miami → Guayaquil</div><h1 id="pageTitle">Today’s operation</h1><p id="pageSub">Only the items that need attention before loading.</p></div><div class="actions"><button class="btn" id="reset">Reset sample</button><button class="btn soft" id="quickAdd">+ Quick WR</button><button class="btn primary" id="addHouse">+ House</button></div></header><div id="content"></div></main></div><aside class="drawer" id="drawer"><div class="drawer-head"><strong id="drawerTitle"></strong><button class="btn sm" id="closeDrawer">Close</button></div><div class="drawer-body" id="drawerBody"></div></aside><div class="toast" id="toast"></div>
<script>
const KEY='consolidatedOS_v2';
const sample={consolidation:{name:'EC-0815',route:'Miami → Guayaquil',booking:'BK-45892',carrier:'Seaboard Marine',vessel:'Ocean Star',voyage:'112S',etd:'2026-08-14',cutoffs:{SI:'2026-08-11T12:00',AES:'2026-08-11T17:00',VGM:'2026-08-12T10:00',Cargo:'2026-08-12T15:00'}},houses:[{id:'H1',hbl:'HBL-001',consignee:'Importadora Ecuador',notify:'Same as consignee',destination:'Guayaquil',shippers:[{id:'S1',name:'ABC Tools',aesStatus:'Ready to file',itn:'',wrs:[{id:'WR-1001',pieces:12,packages:'Boxes',weight:510,cbm:1.8,location:'B-12-2',handling:'Depalletize',ht:false,loadStatus:'Not loaded',dg:false,docs:{invoice:true,packing:true,sli:false,sds:false,imo:false,aes:false},notes:'Customer sending revised SLI.'},{id:'WR-1008',pieces:6,packages:'Boxes',weight:220,cbm:.7,location:'B-12-3',handling:'Complete',ht:true,loadStatus:'Ready',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:''}]},{id:'S2',name:'Miami Parts',aesStatus:'Filed',itn:'X20260806123456',wrs:[{id:'WR-1020',pieces:1,packages:'Pallet',weight:740,cbm:2.3,location:'C-04-1',handling:'Complete',ht:true,loadStatus:'Ready',dg:true,docs:{invoice:true,packing:true,sli:true,sds:true,imo:true,aes:true},notes:'UN3481 Class 9. Keep upright.'}]}]},{id:'H2',hbl:'HBL-002',consignee:'Comercial Quito',notify:'Logística Andina',destination:'Guayaquil',shippers:[{id:'S3',name:'Global Equipment',aesStatus:'Missing Schedule B',itn:'',wrs:[{id:'WR-1040',pieces:2,packages:'Pallets',weight:1480,cbm:4.9,location:'D-10-1',handling:'Repalletize',ht:true,loadStatus:'Loading',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:'Repalletize to two HT pallets.'},{id:'WR-1045',pieces:9,packages:'Crates',weight:880,cbm:3.1,location:'D-10-2',handling:'Inspect',ht:false,loadStatus:'Not loaded',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:'Verify crate markings before load.'}]}]}],templates:[{id:'T1',name:'Master shipping instructions',subject:'Shipping Instructions – {{booking}}',body:'Dear Documentation Team,\n\nPlease find our shipping instructions for booking {{booking}}.\n\nCarrier: {{carrier}}\nVessel/Voyage: {{vessel}} / {{voyage}}\nRoute: {{route}}\nTotal Houses: {{houses}}\nTotal Pieces: {{pieces}}\nTotal Weight: {{weight}} lb\nTotal Measurement: {{cbm}} CBM\n\nPlease issue freight prepaid and telex release. Kindly confirm receipt and send the draft bill for review.\n\nBest regards,'},{id:'T2',name:'Cutoff extension',subject:'Cutoff Extension – {{booking}}',body:'Dear Documentation Team,\n\nPlease grant an extension of the SI cutoff for booking {{booking}}.\nCurrent SI cutoff: {{si_cutoff}}\nVessel/Voyage: {{vessel}} / {{voyage}}\n\nPlease confirm the latest time available.\n\nBest regards,'},{id:'T3',name:'Draft correction',subject:'Draft Correction – {{booking}}',body:'Dear Documentation Team,\n\nPlease correct the draft for booking {{booking}} as follows:\n\n[Enter corrections]\n\nKindly return the revised draft for approval.\n\nBest regards,'}]};
let state=load(),view='today',activeTemplate='T1';
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(sample)}catch{return clone(sample)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function wrs(){return state.houses.flatMap(h=>h.shippers.flatMap(s=>s.wrs.map(w=>({...w,house:h,shipper:s}))))}function total(){const a=wrs();return{houses:state.houses.length,wrs:a.length,pieces:a.reduce((n,w)=>n+(+w.pieces||0),0),weight:a.reduce((n,w)=>n+(+w.weight||0),0),cbm:a.reduce((n,w)=>n+(+w.cbm||0),0)}}function required(w){return w.dg?['invoice','packing','sli','sds','imo']:['invoice','packing','sli']}function missing(w){return required(w).filter(k=>!w.docs[k])}function warehousePending(w){return !['Complete','None'].includes(w.handling)}function isReady(w){return !missing(w).length&&!warehousePending(w)&&w.shipper.aesStatus==='Filed'}function badge(text){let c='gray';if(/ready|filed|complete|loaded/i.test(text))c='green';if(/missing|blocked|not loaded/i.test(text))c='red';if(/loading/i.test(text))c='blue';if(/depalletize|repalletize|inspect|pending|ready to file/i.test(text))c='amber';return `<span class="badge ${c}">${esc(text)}</span>`}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function fmt(d){return new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function hours(d){return Math.round((new Date(d)-new Date())/36e5)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={today:['Today’s operation','Only the items that need attention before loading.'],houses:['Houses & shipper groups','Consignee Houses, shipper AES groups, WRs and files.'],warehouse:['Warehouse queue','Fast action lists for depalletizing, repalletizing, inspection and loading.'],instructions:['Shipping instructions','Use saved templates with live consolidation totals.'],setup:['Consolidation setup','Booking, vessel, cutoffs and reusable templates.']};document.getElementById('eyebrow').textContent=`${state.consolidation.name} · ${state.consolidation.route}`;document.getElementById('pageTitle').textContent=titles[view][0];document.getElementById('pageSub').textContent=titles[view][1];document.getElementById('content').innerHTML=({today:todayView,houses:housesView,warehouse:warehouseView,instructions:instructionsView,setup:setupView})[view]();bindDynamic()}
function todayView(){const a=wrs(),t=total(),attention=a.filter(w=>missing(w).length||warehousePending(w)||w.shipper.aesStatus!=='Filed'||['Not loaded','Held'].includes(w.loadStatus));return `<div class="grid metrics"><div class="card metric"><span>Houses</span><strong>${t.houses}</strong></div><div class="card metric"><span>WRs</span><strong>${t.wrs}</strong></div><div class="card metric alert"><span>Need attention</span><strong>${attention.length}</strong></div><div class="card metric"><span>Ready to load</span><strong>${a.filter(isReady).length}</strong></div><div class="card metric"><span>Total weight</span><strong>${t.weight.toLocaleString()} lb</strong></div></div><div class="grid split"><section class="card panel"><div class="panel-head"><div><h2>Exceptions first</h2><div class="subtle">Fix these before checking anything else.</div></div>${badge(attention.length+' open')}</div><div class="attention-list">${attention.map(w=>{const issue=missing(w).length?`Missing ${missing(w).join(', ')}`:warehousePending(w)?w.handling:w.shipper.aesStatus!=='Filed'?`AES: ${w.shipper.aesStatus}`:`Load: ${w.loadStatus}`;return `<div class="attention"><div class="icon">!</div><div><strong>${w.id} · ${esc(w.house.consignee)}</strong><small>${esc(w.shipper.name)} · ${esc(issue)}</small></div><button class="btn sm open-wr" data-id="${w.id}">Open</button></div>`}).join('')||'<div class="empty">Everything is ready.</div>'}</div></section><aside class="grid"><section class="card panel"><div class="panel-head"><h2>Cutoffs</h2>${badge(state.consolidation.booking)}</div><div class="cutoffs">${Object.entries(state.consolidation.cutoffs).map(([k,v])=>`<div class="cutoff"><div><strong>${k} cutoff</strong><small>${fmt(v)}</small></div>${badge(hours(v)<0?'Overdue':hours(v)+'h')}</div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><h2>Loading pulse</h2></div><div class="attention-list">${['Ready','Loading','Loaded','Not loaded'].map(s=>`<div class="attention"><div class="icon" style="background:var(--blue2);color:var(--blue)">${a.filter(w=>w.loadStatus===s).length}</div><div><strong>${s}</strong><small>Warehouse receipts</small></div></div>`).join('')}</div></section></aside></div>`}
function housesView(){return `<div class="toolbar"><input id="search" placeholder="Search consignee, shipper or WR"><select id="filter"><option value="all">All cargo</option><option value="attention">Needs attention</option><option value="ready">Ready</option><option value="dg">DG only</option></select></div><div class="house-list" id="houseList">${houseCards()}</div>`}function houseCards(q='',f='all'){return state.houses.map(h=>{const hs=h.shippers.map(s=>{const rows=s.wrs.filter(w=>{const x=(h.consignee+s.name+w.id).toLowerCase().includes(q.toLowerCase());const wrap={...w,house:h,shipper:s};return x&&(f==='all'||f==='attention'&&!isReady(wrap)||f==='ready'&&isReady(wrap)||f==='dg'&&w.dg)});if(!rows.length)return'';return `<div class="shipper"><div class="shipper-head"><div><div class="shipper-title">${esc(s.name)}</div><div class="subtle">${s.wrs.length} WR · One AES filing group</div></div><div>${badge(s.aesStatus)} ${s.itn?`<span class="subtle">${esc(s.itn)}</span>`:''}</div></div>${rows.map(w=>`<div class="wr-row"><button class="wr-id open-wr" data-id="${w.id}">${w.id}</button><div><strong>${w.pieces} ${esc(w.packages)}</strong><div class="subtle">${w.weight} lb · ${w.cbm} CBM · ${esc(w.location)}</div></div><div>${badge(w.handling)}</div><div class="doc-dots">${['invoice','packing','sli','sds','imo'].map(k=>`<span title="${k}" class="dot ${w.docs[k]?'ok':''}">${k[0].toUpperCase()}</span>`).join('')}</div><div>${badge(w.loadStatus)}</div><button class="btn sm open-wr" data-id="${w.id}">Update</button></div>`).join('')}</div>`}).join('');if(!hs)return'';const all=h.shippers.flatMap(s=>s.wrs);return `<section class="card house"><div class="house-head"><div><h3>${esc(h.hbl)} · ${esc(h.consignee)}</h3><div class="house-meta">${h.shippers.length} shippers · ${all.length} WR · ${all.reduce((n,w)=>n+(+w.pieces||0),0)} pieces</div></div><div>${badge(all.every(w=>!missing(w).length)?'Docs complete':'Docs pending')}</div></div>${hs}</section>`}).join('')||'<div class="card empty">No matching cargo.</div>'}
function warehouseView(){const groups=['Depalletize','Repalletize','Inspect','Complete'];return `<div class="grid queue-grid">${groups.map(g=>{const list=wrs().filter(w=>w.handling===g);return `<section class="card queue"><div class="panel-head"><h3>${g==='Complete'?'Ready / completed':g}</h3>${badge(list.length+' WR')}</div>${list.map(w=>`<div class="task"><strong>${w.id} · ${esc(w.house.consignee)}</strong><small>${esc(w.shipper.name)} · ${w.pieces} ${esc(w.packages)} · ${esc(w.location)}</small><div class="task-actions"><button class="btn sm open-wr" data-id="${w.id}">Details</button>${g!=='Complete'?`<button class="btn sm primary complete-task" data-id="${w.id}">Complete</button>`:''}</div></div>`).join('')||'<div class="empty">No items</div>'}</section>`}).join('')}</div>`}
function instructionsView(){const t=state.templates.find(x=>x.id===activeTemplate)||state.templates[0],out=fill(t.body),sub=fill(t.subject);return `<div class="grid instruction-grid"><section class="card panel"><div class="panel-head"><h2>Saved templates</h2></div><div class="template-list">${state.templates.map(x=>`<button class="template ${x.id===activeTemplate?'active':''}" data-template="${x.id}"><strong>${esc(x.name)}</strong><small>${esc(fill(x.subject))}</small></button>`).join('')}</div></section><section class="card panel"><div class="panel-head"><div><h2>${esc(t.name)}</h2><div class="subtle">${esc(sub)}</div></div><div class="actions"><button class="btn sm" id="copyInstructions">Copy</button><button class="btn sm primary" id="emailInstructions">Email</button></div></div><div class="preview" id="preview">${esc(out)}</div></section></div>`}function fill(s){const t=total(),c=state.consolidation,m={booking:c.booking,carrier:c.carrier,vessel:c.vessel,voyage:c.voyage,route:c.route,houses:t.houses,pieces:t.pieces,weight:t.weight.toLocaleString(),cbm:t.cbm.toFixed(2),si_cutoff:fmt(c.cutoffs.SI)};return Object.entries(m).reduce((a,[k,v])=>a.replaceAll(`{{${k}}}`,v),s)}
function setupView(){const c=state.consolidation;return `<div class="grid split"><section class="card panel"><div class="panel-head"><h2>Booking details</h2></div><div class="form-grid">${['name','route','booking','carrier','vessel','voyage','etd'].map(k=>`<div class="field"><label>${k}</label><input data-cons="${k}" value="${esc(c[k])}"></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><h2>Cutoffs</h2></div><div class="form-grid">${Object.entries(c.cutoffs).map(([k,v])=>`<div class="field full"><label>${k}</label><input type="datetime-local" data-cutoff="${k}" value="${v}"></div>`).join('')}</div></section></div>`}
function openWR(id){const x=wrs().find(w=>w.id===id);if(!x)return;document.getElementById('drawerTitle').textContent=`${x.id} · ${x.shipper.name}`;document.getElementById('drawerBody').innerHTML=`<div class="section"><h3>House and cargo</h3><div class="form-grid"><div class="field"><label>Consignee / House</label><input value="${esc(x.house.consignee)}" disabled></div><div class="field"><label>Shipper / AES group</label><input value="${esc(x.shipper.name)}" disabled></div>${['pieces','packages','weight','cbm','location'].map(k=>`<div class="field"><label>${k}</label><input data-wr="${k}" data-id="${x.id}" value="${esc(x[k])}"></div>`).join('')}</div></div><div class="section"><h3>Documents</h3><div class="docs">${Object.entries(x.docs).map(([k,v])=>`<label class="doc"><span>${k.toUpperCase()}</span><input type="checkbox" data-doc="${k}" data-id="${x.id}" ${v?'checked':''}></label>`).join('')}</div></div><div class="section"><h3>Warehouse & loading</h3><div class="form-grid"><div class="field"><label>Action</label><select data-wr="handling" data-id="${x.id}">${['None','Depalletize','Repalletize','Inspect','Complete'].map(v=>`<option ${v===x.handling?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Loading status</label><select data-wr="loadStatus" data-id="${x.id}">${['Not loaded','Ready','Loading','Loaded','Partial','Held'].map(v=>`<option ${v===x.loadStatus?'selected':''}>${v}</option>`).join('')}</select></div><label class="doc"><span>HT pallet required</span><input type="checkbox" data-wr-check="ht" data-id="${x.id}" ${x.ht?'checked':''}></label><label class="doc"><span>Dangerous goods</span><input type="checkbox" data-wr-check="dg" data-id="${x.id}" ${x.dg?'checked':''}></label><div class="field full"><label>Notes</label><textarea rows="4" data-wr="notes" data-id="${x.id}">${esc(x.notes)}</textarea></div></div></div><div class="section"><h3>AES filing group</h3><div class="note"><strong>${esc(x.shipper.name)}</strong><div class="subtle">All WRs from this shipper inside ${esc(x.house.hbl)} are grouped into one AES filing.</div><div style="margin-top:8px">${badge(x.shipper.aesStatus)} ${x.shipper.itn?esc(x.shipper.itn):''}</div></div></div>`;document.getElementById('drawer').classList.add('open');bindDynamic()}
function bindDynamic(){document.querySelectorAll('.open-wr').forEach(b=>b.onclick=()=>openWR(b.dataset.id));document.querySelectorAll('.complete-task').forEach(b=>b.onclick=()=>{const x=wrs().find(w=>w.id===b.dataset.id);x.handling='Complete';if(!missing(x).length&&x.shipper.aesStatus==='Filed')x.loadStatus='Ready';save();toast('Warehouse action completed');render()});document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{activeTemplate=b.dataset.template;render()});const s=document.getElementById('search'),f=document.getElementById('filter');if(s&&f){const go=()=>document.getElementById('houseList').innerHTML=houseCards(s.value,f.value);s.oninput=go;f.onchange=go}document.querySelectorAll('[data-wr]').forEach(e=>e.onchange=()=>{const x=wrs().find(w=>w.id===e.dataset.id);x[e.dataset.wr]=['pieces','weight','cbm'].includes(e.dataset.wr)?+e.value:e.value;save();toast('Saved')});document.querySelectorAll('[data-wr-check]').forEach(e=>e.onchange=()=>{const x=wrs().find(w=>w.id===e.dataset.id);x[e.dataset.wrCheck]=e.checked;save();toast('Saved')});document.querySelectorAll('[data-doc]').forEach(e=>e.onchange=()=>{const x=wrs().find(w=>w.id===e.dataset.id);x.docs[e.dataset.doc]=e.checked;save();toast('Document status updated')});document.querySelectorAll('[data-cons]').forEach(e=>e.onchange=()=>{state.consolidation[e.dataset.cons]=e.value;save();render()});document.querySelectorAll('[data-cutoff]').forEach(e=>e.onchange=()=>{state.consolidation.cutoffs[e.dataset.cutoff]=e.value;save();render()});const cp=document.getElementById('copyInstructions');if(cp)cp.onclick=()=>navigator.clipboard.writeText(document.getElementById('preview').textContent).then(()=>toast('Instructions copied'));const em=document.getElementById('emailInstructions');if(em)em.onclick=()=>{const t=state.templates.find(x=>x.id===activeTemplate);location.href=`mailto:?subject=${encodeURIComponent(fill(t.subject))}&body=${encodeURIComponent(fill(t.body))}`}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('closeDrawer').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('reset').onclick=()=>{state=clone(sample);save();render();toast('Sample restored')};document.getElementById('quickAdd').onclick=()=>{const h=state.houses[0],s=h.shippers[0],id='WR-'+Math.floor(1000+Math.random()*8999);s.wrs.push({id,pieces:1,packages:'Boxes',weight:0,cbm:0,location:'',handling:'None',ht:false,loadStatus:'Not loaded',dg:false,docs:{invoice:false,packing:false,sli:false,sds:false,imo:false,aes:false},notes:''});save();render();openWR(id)};document.getElementById('addHouse').onclick=()=>{const n=state.houses.length+1;state.houses.push({id:'H'+Date.now(),hbl:'HBL-'+String(n).padStart(3,'0'),consignee:'New consignee',notify:'',destination:'Guayaquil',shippers:[{id:'S'+Date.now(),name:'New shipper',aesStatus:'Pending',itn:'',wrs:[]}]});save();view='houses';render();toast('House added')};render();
</script></body></html>
