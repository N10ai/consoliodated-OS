<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consolidated OS</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#15803d;--yellow:#b45309;--red:#b91c1c;--blue:#0369a1;--shadow:0 12px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:22px}.brand small{display:block;color:#93c5fd;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.main{padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.title h1{font-size:28px;letter-spacing:-.04em;margin:0}.title p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:10px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--red)}
    .grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:16px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:26px;font-weight:800;margin-top:5px}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;color:var(--ink)}.toolbar input{min-width:220px;flex:1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{border-bottom:1px solid var(--line);padding:11px 10px;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f8fafc;position:sticky;top:0}.group-row{background:#eff6ff;font-weight:800}.subgroup-row{background:#f8fafc;font-weight:700}.indent1{padding-left:26px!important}.indent2{padding-left:48px!important}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.green{background:#dcfce7;color:var(--green)}.yellow{background:#fef3c7;color:var(--yellow)}.red{background:#fee2e2;color:var(--red)}.blue{background:#e0f2fe;color:var(--blue)}.gray{background:#f1f5f9;color:#475569}.link{color:var(--accent);font-weight:700;background:none;border:0;padding:0}.empty{padding:40px;text-align:center;color:var(--muted)}
    .split{grid-template-columns:1.2fr .8fr}.stack{display:grid;gap:14px}.cutoff{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.cutoff:last-child{border-bottom:0}.cutoff strong{display:block}.cutoff small{color:var(--muted)}.list{display:grid;gap:9px}.list-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.list-item strong{display:block}.list-item small{color:var(--muted)}
    .drawer{position:fixed;inset:0 0 0 auto;width:min(620px,100%);background:#fff;box-shadow:-18px 0 45px rgba(15,23,42,.16);z-index:20;transform:translateX(100%);transition:.2s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}.drawer-body{padding:18px}.section{margin-bottom:20px}.section h3{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:#475569}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.field.full{grid-column:1/-1}.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.doc{border:1px solid var(--line);border-radius:12px;padding:10px}.doc input{width:100%;margin-top:6px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px}.template-output{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:14px;padding:16px;min-height:240px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;padding:18px;z-index:30}.modal.open{display:grid}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(15,23,42,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0}.footer-note{color:var(--muted);font-size:12px;margin-top:12px}
    @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px 5px;font-size:12px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:600px){.topbar{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.fields,.doc-grid,.checks{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.title h1{font-size:23px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Consolidated OS<small>Ocean operations MVP</small></div>
    <div class="nav">
      <button class="active" data-view="dashboard">Dashboard</button>
      <button data-view="houses">Houses</button>
      <button data-view="warehouse">Warehouse</button>
      <button data-view="instructions">Instructions</button>
      <button data-view="templates">Templates</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="title"><h1 id="pageTitle">Consolidation Dashboard</h1><p id="pageSubtitle">One place for Houses, shippers, WRs, files, AES groups, cutoffs and loading readiness.</p></div>
      <div class="actions"><button class="btn" id="loadSample">Reset sample</button><button class="btn primary" id="addHouse">+ Add House</button></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="drawer" id="drawer"><div class="drawer-head"><strong id="drawerTitle">WR</strong><button class="btn" id="closeDrawer">Close</button></div><div class="drawer-body" id="drawerBody"></div></div>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn" id="closeModal">Close</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='consolidatedOS_v1';
const sample={
  consolidation:{name:'EC-0815',route:'Miami → Guayaquil',booking:'BK-45892',carrier:'Seaboard Marine',vessel:'Ocean Star',voyage:'112S',etd:'2026-08-14',cutoffs:{si:'2026-08-11T12:00',aes:'2026-08-11T17:00',vgm:'2026-08-12T10:00',cargo:'2026-08-12T15:00'}},
  houses:[
    {id:'H1',hbl:'HBL-001',consignee:'Importadora Ecuador',notify:'Same as consignee',destination:'Guayaquil',status:'Attention',shippers:[
      {id:'S1',name:'ABC Tools',aesStatus:'Ready to file',itn:'',wrs:[
        {id:'WR-1001',pieces:12,packages:'Boxes',weight:510,cbm:1.8,location:'B-12-2',handling:'Depalletize',palletHT:false,loaded:'Not loaded',docs:{invoice:true,packing:true,sli:false,sds:false,imo:false,aes:false},dg:false,notes:'Customer sending revised SLI.'},
        {id:'WR-1008',pieces:6,packages:'Boxes',weight:220,cbm:.7,location:'B-12-3',handling:'Keep palletized',palletHT:true,loaded:'Ready',docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},dg:false,notes:''}
      ]},
      {id:'S2',name:'Miami Parts',aesStatus:'Filed',itn:'X20260806123456',wrs:[
        {id:'WR-1020',pieces:1,packages:'Pallet',weight:740,cbm:2.3,location:'C-04-1',handling:'Keep palletized',palletHT:true,loaded:'Ready',docs:{invoice:true,packing:true,sli:true,sds:true,imo:true,aes:true},dg:true,notes:'UN3481 Class 9. Keep upright.'}
      ]}
    ]},
    {id:'H2',hbl:'HBL-002',consignee:'Comercial Quito',notify:'Logística Andina',destination:'Guayaquil',status:'Ready',shippers:[
      {id:'S3',name:'Global Equipment',aesStatus:'Missing Schedule B',itn:'',wrs:[
        {id:'WR-1040',pieces:2,packages:'Pallets',weight:1480,cbm:4.9,location:'D-10-1',handling:'Repalletize',palletHT:true,loaded:'Loading',docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},dg:false,notes:'Repalletize to two HT pallets.'},
        {id:'WR-1045',pieces:9,packages:'Crates',weight:880,cbm:3.1,location:'D-10-2',handling:'Inspect',palletHT:false,loaded:'Not loaded',docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},dg:false,notes:'Verify crate markings before load.'}
      ]}
    ]}
  ],
  templates:[
    {id:'T1',name:'Standard master instructions',subject:'Shipping Instructions – {{booking}}',body:'Dear Documentation Team,\n\nPlease find our shipping instructions for booking {{booking}}.\n\nCarrier: {{carrier}}\nVessel/Voyage: {{vessel}} / {{voyage}}\nPOL/POD: Miami / Guayaquil\nTotal Houses: {{house_count}}\nTotal Pieces: {{pieces}}\nTotal Weight: {{weight}} lb\nTotal Measurement: {{cbm}} CBM\n\nPlease issue freight prepaid and telex release. Kindly confirm receipt and send the draft bill for review.\n\nBest regards,'},
    {id:'T2',name:'Cutoff extension request',subject:'Cutoff Extension Request – {{booking}}',body:'Dear Documentation Team,\n\nWe request an extension of the shipping-instructions cutoff for booking {{booking}} until [requested date/time].\n\nCurrent SI cutoff: {{si_cutoff}}\nVessel/Voyage: {{vessel}} / {{voyage}}\n\nPlease confirm whether this can be accommodated.\n\nBest regards,'}
  ]
};
let state=load();let currentView='dashboard';let selectedWR=null;
function clone(v){return JSON.parse(JSON.stringify(v))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(sample)}catch{return clone(sample)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function allWRs(){return state.houses.flatMap(h=>h.shippers.flatMap(s=>s.wrs.map(w=>({...w,house:h,shipper:s}))))}function totals(){const wrs=allWRs();return{houses:state.houses.length,shippers:state.houses.reduce((n,h)=>n+h.shippers.length,0),wrs:wrs.length,pieces:wrs.reduce((n,w)=>n+Number(w.pieces||0),0),weight:wrs.reduce((n,w)=>n+Number(w.weight||0),0),cbm:wrs.reduce((n,w)=>n+Number(w.cbm||0),0)}}
function ready(w){const req=w.dg?['invoice','packing','sli','sds','imo']:['invoice','packing','sli'];return req.every(k=>w.docs[k])&&w.handling!=='Depalletize'&&w.handling!=='Repalletize'&&w.handling!=='Inspect'}function statusBadge(text){let c='gray';if(/ready|filed|complete/i.test(text))c='green';else if(/missing|attention|blocked|not loaded/i.test(text))c='red';else if(/loading|progress/i.test(text))c='blue';else if(/pending|depalletize|repalletize|inspect/i.test(text))c='yellow';return `<span class="badge ${c}">${text}</span>`}
function daysTo(date){const ms=new Date(date)-new Date();return Math.ceil(ms/86400000)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));const titles={dashboard:['Consolidation Dashboard','See what is missing, ready, loading or blocked.'],houses:['Houses & AES Groups','Houses by consignee, then shippers and their Warehouse Receipts.'],warehouse:['Warehouse Queue','Daily actions for depalletizing, repalletizing, inspection and loading.'],instructions:['Shipping Instructions','Generate prefilled instructions and emails in seconds.'],templates:['Template Library','Store reusable carrier and route instructions.']};document.getElementById('pageTitle').textContent=titles[currentView][0];document.getElementById('pageSubtitle').textContent=titles[currentView][1];document.getElementById('content').innerHTML=({dashboard:dashboardView,houses:housesView,warehouse:warehouseView,instructions:instructionsView,templates:templatesView})[currentView]();bind();}
function dashboardView(){const t=totals(),wrs=allWRs(),missing=wrs.filter(w=>!ready(w)).length,loading=wrs.filter(w=>/Loading|Ready/.test(w.loaded)).length;return `<div class="grid stats"><div class="card stat"><div class="label">Houses</div><div class="value">${t.houses}</div></div><div class="card stat"><div class="label">Warehouse Receipts</div><div class="value">${t.wrs}</div></div><div class="card stat"><div class="label">Need attention</div><div class="value">${missing}</div></div><div class="card stat"><div class="label">Ready / Loading</div><div class="value">${loading}</div></div><div class="card stat"><div class="label">Total weight</div><div class="value">${t.weight.toLocaleString()} lb</div></div></div><div class="grid split"><section class="card panel"><h2>${esc(state.consolidation.name)} · ${esc(state.consolidation.route)}</h2><div class="list">${state.houses.map(h=>{const wrs=h.shippers.flatMap(s=>s.wrs);const blocked=wrs.filter(w=>!ready(w)).length;return `<div class="list-item"><div><strong>${esc(h.hbl)} — ${esc(h.consignee)}</strong><small>${h.shippers.length} shippers · ${wrs.length} WRs · ${wrs.reduce((n,w)=>n+Number(w.pieces),0)} pieces</small></div>${statusBadge(blocked?`${blocked} blocked`:'Ready')}</div>`}).join('')}</div></section><section class="card panel"><h2>Cutoffs</h2>${Object.entries(state.consolidation.cutoffs).map(([k,v])=>`<div class="cutoff"><div><strong>${k.toUpperCase()} cutoff</strong><small>${new Date(v).toLocaleString()}</small></div>${statusBadge(daysTo(v)<0?'Overdue':daysTo(v)<=2?`${daysTo(v)} days`:'Scheduled')}</div>`).join('')}</section></div>`}
function housesView(){return `<section class="card panel"><div class="toolbar"><input id="search" placeholder="Search House, consignee, shipper or WR"><select id="filter"><option value="all">All</option><option value="blocked">Blocked only</option><option value="dg">DG only</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>House / Shipper / WR</th><th>Pieces</th><th>Weight</th><th>Handling</th><th>Docs</th><th>AES</th><th>Load</th><th></th></tr></thead><tbody id="houseRows">${houseRows()}</tbody></table></div></section>`}
function houseRows(q='',filter='all'){let html='';state.houses.forEach(h=>{const houseText=`${h.hbl} ${h.consignee}`.toLowerCase();const shipRows=[];h.shippers.forEach(s=>{const wrRows=s.wrs.filter(w=>{const text=`${h.hbl} ${h.consignee} ${s.name} ${w.id}`.toLowerCase();return (!q||text.includes(q))&&(filter==='all'||filter==='blocked'&&!ready(w)||filter==='dg'&&w.dg)});if(wrRows.length||(!q&&filter==='all')){shipRows.push(`<tr class="subgroup-row"><td class="indent1">${esc(s.name)} <span class="badge gray">${s.wrs.length} WRs</span></td><td>${s.wrs.reduce((n,w)=>n+Number(w.pieces),0)}</td><td>${s.wrs.reduce((n,w)=>n+Number(w.weight),0).toLocaleString()} lb</td><td>—</td><td>${statusBadge(s.wrs.every(ready)?'Complete':'Review')}</td><td>${statusBadge(s.aesStatus)}</td><td>—</td><td><button class="link edit-shipper" data-h="${h.id}" data-s="${s.id}">Edit AES</button></td></tr>`);wrRows.forEach(w=>shipRows.push(`<tr><td class="indent2"><button class="link open-wr" data-wr="${w.id}">${esc(w.id)}</button>${w.dg?' <span class="badge red">DG</span>':''}</td><td>${w.pieces} ${esc(w.packages)}</td><td>${Number(w.weight).toLocaleString()} lb</td><td>${statusBadge(w.handling)}</td><td>${statusBadge(ready(w)?'Complete':'Missing')}</td><td>${statusBadge(s.itn?'Covered':'Pending')}</td><td>${statusBadge(w.loaded)}</td><td><button class="link open-wr" data-wr="${w.id}">Open</button></td></tr>`))}});if(shipRows.length){html+=`<tr class="group-row"><td>${esc(h.hbl)} — ${esc(h.consignee)}</td><td colspan="2">${h.shippers.length} shippers</td><td colspan="3">${esc(h.destination)}</td><td>${statusBadge(h.status)}</td><td></td></tr>${shipRows.join('')}`}});return html||`<tr><td colspan="8" class="empty">No matching cargo.</td></tr>`}
function warehouseView(){const wrs=allWRs();const groups=['Depalletize','Repalletize','Inspect','Keep palletized'];return `<div class="grid split"><section class="card panel"><h2>Action Queue</h2><div class="list">${groups.map(g=>{const arr=wrs.filter(w=>w.handling===g);return `<div class="list-item"><div><strong>${g}</strong><small>${arr.map(w=>w.id).join(', ')||'No pending WRs'}</small></div><span class="badge ${arr.length?'yellow':'green'}">${arr.length}</span></div>`}).join('')}</div></section><section class="card panel"><h2>Loading Status</h2><div class="list">${['Not loaded','Ready','Loading','Loaded','Partial','Held'].map(g=>{const arr=wrs.filter(w=>w.loaded===g);return `<div class="list-item"><div><strong>${g}</strong><small>${arr.map(w=>w.id).join(', ')||'None'}</small></div><span class="badge gray">${arr.length}</span></div>`}).join('')}</div></section></div><section class="card panel" style="margin-top:14px"><h2>All Warehouse Receipts</h2><div class="table-wrap"><table class="table"><thead><tr><th>WR</th><th>House</th><th>Shipper</th><th>Location</th><th>Handling</th><th>HT pallet</th><th>Ready</th><th></th></tr></thead><tbody>${wrs.map(w=>`<tr><td><button class="link open-wr" data-wr="${w.id}">${w.id}</button></td><td>${w.house.hbl}</td><td>${esc(w.shipper.name)}</td><td>${esc(w.location)}</td><td>${statusBadge(w.handling)}</td><td>${w.palletHT?'Yes':'No'}</td><td>${statusBadge(ready(w)?'Ready':'Blocked')}</td><td><button class="link open-wr" data-wr="${w.id}">Update</button></td></tr>`).join('')}</tbody></table></div></section>`}
function instructionsView(){const options=state.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');return `<div class="grid split"><section class="card panel"><h2>Generate instructions</h2><div class="fields"><div class="field"><label>Template</label><select id="templateSelect">${options}</select></div><div class="field"><label>Scope</label><select id="scopeSelect"><option value="master">Master consolidation</option>${state.houses.map(h=>`<option value="${h.id}">${h.hbl} — ${esc(h.consignee)}</option>`).join('')}</select></div><div class="field full"><label>Additional notes</label><textarea id="instructionNotes" rows="4" placeholder="Add corrections, special release or loading notes"></textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="generateInstructions">Generate</button><button class="btn" id="copyInstructions">Copy</button><button class="btn" id="emailInstructions">Open email</button></div><div class="footer-note">Templates use consolidation data automatically. Review before sending.</div></section><section class="card panel"><h2>Preview</h2><div id="instructionOutput" class="template-output">Choose a template and click Generate.</div></section></div>`}
function templatesView(){return `<section class="card panel"><div class="actions" style="margin-bottom:14px"><button class="btn primary" id="addTemplate">+ Add template</button></div><div class="list">${state.templates.map(t=>`<div class="list-item"><div><strong>${esc(t.name)}</strong><small>${esc(t.subject)}</small></div><button class="link edit-template" data-id="${t.id}">Edit</button></div>`).join('')}</div></section>`}
function bind(){document.querySelectorAll('.open-wr').forEach(b=>b.onclick=()=>openWR(b.dataset.wr));document.querySelectorAll('.edit-shipper').forEach(b=>b.onclick=()=>editShipper(b.dataset.h,b.dataset.s));const s=document.getElementById('search'),f=document.getElementById('filter');if(s&&f){const u=()=>document.getElementById('houseRows').innerHTML=houseRows(s.value.toLowerCase(),f.value);s.oninput=u;f.onchange=u}const g=document.getElementById('generateInstructions');if(g)g.onclick=generateInstructions;const c=document.getElementById('copyInstructions');if(c)c.onclick=()=>navigator.clipboard.writeText(document.getElementById('instructionOutput').textContent);const e=document.getElementById('emailInstructions');if(e)e.onclick=openEmail;const a=document.getElementById('addTemplate');if(a)a.onclick=()=>editTemplate();document.querySelectorAll('.edit-template').forEach(b=>b.onclick=()=>editTemplate(b.dataset.id));}
function findWR(id){for(const h of state.houses)for(const s of h.shippers)for(const w of s.wrs)if(w.id===id)return{h,s,w}}function openWR(id){const x=findWR(id);if(!x)return;selectedWR=x;document.getElementById('drawerTitle').textContent=`${x.w.id} · ${x.s.name}`;document.getElementById('drawerBody').innerHTML=`<div class="section"><h3>Warehouse</h3><div class="fields"><div class="field"><label>Pieces</label><input id="wrPieces" type="number" value="${x.w.pieces}"></div><div class="field"><label>Package type</label><input id="wrPackages" value="${esc(x.w.packages)}"></div><div class="field"><label>Weight lb</label><input id="wrWeight" type="number" value="${x.w.weight}"></div><div class="field"><label>CBM</label><input id="wrCbm" type="number" step="0.01" value="${x.w.cbm}"></div><div class="field"><label>Location</label><input id="wrLocation" value="${esc(x.w.location)}"></div><div class="field"><label>Handling</label><select id="wrHandling">${['Keep palletized','Depalletize','Repalletize','Inspect','Loose cargo','Complete'].map(v=>`<option ${x.w.handling===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Loading status</label><select id="wrLoaded">${['Not loaded','Ready','Loading','Loaded','Partial','Held'].map(v=>`<option ${x.w.loaded===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>HT pallet</label><select id="wrHT"><option value="false" ${!x.w.palletHT?'selected':''}>No</option><option value="true" ${x.w.palletHT?'selected':''}>Yes</option></select></div></div></div><div class="section"><h3>Documents</h3><div class="doc-grid">${Object.keys(x.w.docs).map(k=>`<label class="doc"><strong>${k.toUpperCase()}</strong><div><input class="docCheck" data-key="${k}" type="checkbox" ${x.w.docs[k]?'checked':''}> Received / uploaded</div><input type="file" aria-label="Upload ${k}"></label>`).join('')}</div></div><div class="section"><h3>Special cargo</h3><div class="checks"><label class="check"><input id="wrDG" type="checkbox" ${x.w.dg?'checked':''}> Dangerous goods / IMO</label></div></div><div class="section"><h3>Notes</h3><div class="field"><textarea id="wrNotes" rows="5">${esc(x.w.notes)}</textarea></div></div><div class="actions"><button class="btn primary" id="saveWR">Save WR</button><button class="btn" id="downloadPackage">Download checklist</button></div>`;document.getElementById('drawer').classList.add('open');document.getElementById('saveWR').onclick=saveWR;document.getElementById('downloadPackage').onclick=downloadChecklist}
function saveWR(){const {w}=selectedWR;w.pieces=Number(document.getElementById('wrPieces').value);w.packages=document.getElementById('wrPackages').value;w.weight=Number(document.getElementById('wrWeight').value);w.cbm=Number(document.getElementById('wrCbm').value);w.location=document.getElementById('wrLocation').value;w.handling=document.getElementById('wrHandling').value;w.loaded=document.getElementById('wrLoaded').value;w.palletHT=document.getElementById('wrHT').value==='true';w.dg=document.getElementById('wrDG').checked;w.notes=document.getElementById('wrNotes').value;document.querySelectorAll('.docCheck').forEach(c=>w.docs[c.dataset.key]=c.checked);save();render();document.getElementById('drawer').classList.remove('open')}
function downloadChecklist(){const {h,s,w}=selectedWR;const text=`${w.id}\nHouse: ${h.hbl} - ${h.consignee}\nShipper: ${s.name}\nPieces: ${w.pieces} ${w.packages}\nWeight: ${w.weight} lb\nCBM: ${w.cbm}\nHandling: ${w.handling}\nHT Pallet: ${w.palletHT?'Yes':'No'}\nLoading: ${w.loaded}\nDocuments: ${Object.entries(w.docs).map(([k,v])=>`${k.toUpperCase()}: ${v?'YES':'MISSING'}`).join(', ')}\nNotes: ${w.notes}`;download(`${w.id}_checklist.txt`,text)}
function editShipper(hid,sid){const h=state.houses.find(h=>h.id===hid),s=h.shippers.find(s=>s.id===sid);openModal('AES filing group',`<div class="fields"><div class="field full"><label>Shipper</label><input value="${esc(s.name)}" disabled></div><div class="field"><label>AES status</label><select id="aesStatus">${['Not started','Missing information','Ready to file','Filed','Exempt'].map(v=>`<option ${s.aesStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>ITN / exemption</label><input id="itn" value="${esc(s.itn)}"></div></div><div class="list" style="margin-top:14px">${s.wrs.map(w=>`<div class="list-item"><div><strong>${w.id}</strong><small>${w.pieces} ${w.packages} · ${w.weight} lb</small></div>${statusBadge(ready(w)?'Docs ready':'Review')}</div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveAES">Save AES group</button></div>`);document.getElementById('saveAES').onclick=()=>{s.aesStatus=document.getElementById('aesStatus').value;s.itn=document.getElementById('itn').value;save();closeModal();render()}}
function vars(scope){const t=totals(),h=state.houses.find(x=>x.id===scope);const wrs=h?h.shippers.flatMap(s=>s.wrs):allWRs();return{booking:state.consolidation.booking,carrier:state.consolidation.carrier,vessel:state.consolidation.vessel,voyage:state.consolidation.voyage,house_count:h?1:t.houses,pieces:wrs.reduce((n,w)=>n+Number(w.pieces),0),weight:wrs.reduce((n,w)=>n+Number(w.weight),0).toLocaleString(),cbm:wrs.reduce((n,w)=>n+Number(w.cbm),0).toFixed(2),si_cutoff:new Date(state.consolidation.cutoffs.si).toLocaleString(),consignee:h?h.consignee:'Multiple consignees',hbl:h?h.hbl:'Multiple Houses'}}function fill(text,v){return text.replace(/{{(\w+)}}/g,(_,k)=>v[k]??`[${k}]`)}
function generateInstructions(){const t=state.templates.find(x=>x.id===document.getElementById('templateSelect').value),scope=document.getElementById('scopeSelect').value,v=vars(scope),notes=document.getElementById('instructionNotes').value;document.getElementById('instructionOutput').textContent=`Subject: ${fill(t.subject,v)}\n\n${fill(t.body,v)}${notes?`\n\nAdditional notes:\n${notes}`:''}`}
function openEmail(){const text=document.getElementById('instructionOutput').textContent;const lines=text.split('\n');const subject=lines.shift().replace(/^Subject:\s*/,'');location.href=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join('\n'))}`}
function editTemplate(id){const t=id?state.templates.find(x=>x.id===id):{id:'T'+Date.now(),name:'',subject:'',body:''};openModal(id?'Edit template':'New template',`<div class="fields"><div class="field full"><label>Name</label><input id="tplName" value="${esc(t.name)}"></div><div class="field full"><label>Subject</label><input id="tplSubject" value="${esc(t.subject)}"></div><div class="field full"><label>Body</label><textarea id="tplBody" rows="14">${esc(t.body)}</textarea></div></div><div class="footer-note">Available variables: {{booking}}, {{carrier}}, {{vessel}}, {{voyage}}, {{house_count}}, {{pieces}}, {{weight}}, {{cbm}}, {{si_cutoff}}, {{consignee}}, {{hbl}}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveTpl">Save template</button></div>`);document.getElementById('saveTpl').onclick=()=>{t.name=document.getElementById('tplName').value||'Untitled template';t.subject=document.getElementById('tplSubject').value;t.body=document.getElementById('tplBody').value;if(!id)state.templates.push(t);save();closeModal();render()}}
function addHouse(){const n=state.houses.length+1;state.houses.push({id:'H'+Date.now(),hbl:`HBL-${String(n).padStart(3,'0')}`,consignee:'New Consignee',notify:'',destination:'Guayaquil',status:'Attention',shippers:[]});save();currentView='houses';render()}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});document.getElementById('closeDrawer').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('closeModal').onclick=closeModal;document.getElementById('addHouse').onclick=addHouse;document.getElementById('loadSample').onclick=()=>{state=clone(sample);save();render()};render();
</script>
</body>
</html>
