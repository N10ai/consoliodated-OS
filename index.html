adding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.summary-table th{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.table-wrap{width:100%;overflow:auto}.house{overflow:hidden}.house-head{padding:13px 15px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.house-head h3{margin:0;font-size:16px}.shipper{padding:12px 15px;border-bottom:1px solid var(--line)}.shipper:last-child{border-bottom:0}.shipper-top{display:flex;justify-content:space-between;gap:10px}.wr-row{display:grid;grid-template-columns:100px 1fr 90px 90px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#d0d5dd;margin-right:4px}.dot.ok{background:#12b76a}.dot.bad{background:#f04438}.attention-list{display:grid;gap:7px}.attention{border:1px solid var(--line);border-left:4px solid #d97706;border-radius:11px;padding:10px;display:flex;justify-content:space-between;gap:10px}.attention.redline{border-left-color:#d92d20}.field{display:grid;gap:4px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:850}.field input,.field select,.field textarea,.searchbar input,.searchbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;min-width:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.drawer{position:fixed;z-index:50;inset:0 0 0 auto;width:min(590px,100%);background:#fff;box-shadow:-20px 0 50px rgba(16,24,40,.18);transform:translateX(100%);transition:.2s;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between;z-index:2}.drawer-body{padding:14px}.quick{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;white-space:nowrap}.quick.good{border-color:#abefc6;color:#067647;background:#f6fef9}.quick.warn{border-color:#fedf89;color:#93370d;background:#fffcf5}.docs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.docbox{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fafafa}.docbox strong{display:block;text-transform:uppercase;font-size:11px}.docfile{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}.docfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-upload{display:none}.upload-label{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}.searchbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.searchbar input{flex:1;min-width:200px}.cargo-actions{display:flex;gap:5px}.cargo-actions select{max-width:190px}.loading-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.5fr);gap:12px}.viewer{position:relative;height:520px;border-radius:14px;overflow:hidden;background:#0c1425}.viewer canvas{width:100%;height:100%;display:block;touch-action:none}.viewer-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.viewer-tools>*{pointer-events:auto}.planner-list{display:grid;gap:7px;max-height:520px;overflow:auto}.loadunit{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}.loadunit.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,119,255,.1)}.loadunit-top{display:flex;justify-content:space-between;gap:8px}.loadunit-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.loadunit-actions button{border:1px solid var(--line);background:#fafafa;border-radius:7px;padding:6px;font-size:11px;font-weight:800}.stack-row{display:flex;align-items:center;gap:6px;margin-top:7px}.stack-row select{border:1px solid var(--line);border-radius:7px;padding:5px;background:#fff}.load-alert{padding:9px;border-radius:9px;margin-bottom:8px;background:var(--greenbg);color:var(--green);font-weight:750}.load-alert.bad{background:var(--redbg);color:var(--red)}.template-layout{display:grid;grid-template-columns:270px 1fr;gap:12px}.template-list{padding:9px}.template-list button{width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:9px;font-weight:780}.template-list button.active{background:var(--accent2);color:var(--accent)}.output{white-space:pre-wrap;background:#101828;color:#e4e7ec;border-radius:12px;padding:15px;min-height:300px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#101828;color:#fff;padding:10px 13px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.two,.loading-layout,.template-layout{grid-template-columns:1fr}.shipment-card{grid-template-columns:1fr auto}}
@media(max-width:760px){.shell{display:block}.side{position:sticky;z-index:30;top:0;width:100%;height:auto;padding:10px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.side::-webkit-scrollbar{display:none}.brand{flex:0 0 auto;padding:0 8px 0 0;font-size:17px}.brand small,.side .section{display:none}.side button{flex:0 0 auto;width:auto;margin:0;padding:9px 10px;white-space:nowrap}.main{padding:12px}.top,.workspace-row{flex-direction:column}.top h1{font-size:23px}.shipment-card{grid-template-columns:1fr;padding:13px}.shipment-card>.btn{width:100%}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr}.summary-table{min-width:650px}.mobile-cards .summary-table{min-width:0}.mobile-cards thead{display:none}.mobile-cards tbody,.mobile-cards tr,.mobile-cards td{display:block;width:100%}.mobile-cards tr{border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:8px}.mobile-cards td{border:0;padding:3px 0}.mobile-cards td:before{content:attr(data-label);display:inline-block;min-width:86px;margin-right:8px;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:850}.wr-row{grid-template-columns:1fr 1fr}.wr-row>*:nth-child(n+3){font-size:12px}.form-grid,.docs-grid{grid-template-columns:1fr}.full{grid-column:auto}.viewer{height:390px}.drawer{width:100%}.planner-list{max-height:none}}

<body>
<div class="shell"><aside class="side"><div class="brand">Consolidated OS<small>Ocean Operations</small></div><div class="section">Work</div><button class="active" data-nav="shipments">Shipments</button><button data-nav="cargo">Cargo on Hand</button><button data-nav="attention">Attention</button><div class="section">System</div><button data-nav="templates">Templates</button></aside><main class="main"><div id="app"></div></main></div>
<div class="drawer" id="drawer"><div class="drawer-head"><strong id="drawerTitle"></strong><button class="btn small" onclick="closeDrawer()">Close</button></div><div class="drawer-body" id="drawerBody"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='consolidatedOS_v6',DB='consolidatedOS_docs';
const CONTAINER={length:11.56,width:2.29,height:2.40};
const sample={cargoPool:[{id:'WR-1060',shipper:'Pacific Tools LLC',consignee:'Importadora Ecuador',pieces:8,packages:'Boxes',weight:410,cbm:1.35,length:1.2,width:.8,height:1.4,location:'A-08-2',assignedShipmentId:''},{id:'WR-1061',shipper:'Miami Parts',consignee:'Importadora Ecuador',pieces:2,packages:'Pallets',weight:980,cbm:3.4,length:1.2,width:1,height:1.42,location:'C-04-2',assignedShipmentId:''}],shipments:[{id:'SH32',week:32,name:'Ecuador Consolidation – Week 32',booking:'BK-45892',carrier:'Seaboard Marine',route:'Miami → Guayaquil',vessel:'Ocean Star',voyage:'112S',etd:'2026-08-14',status:'Preparing',equipment:'40 NOR',capacityCBM:52,cutoffs:{si:'2026-08-11T12:00',aes:'2026-08-11T17:00',vgm:'2026-08-12T10:00',cargo:'2026-08-12T15:00'},houses:[{id:'H1',hbl:'HBL-001',consignee:'Importadora Ecuador',notify:'Same as consignee',shippers:[{id:'S1',name:'ABC Tools',aesStatus:'Ready to file',itn:'',wrs:[{id:'WR-1001',pieces:12,packages:'Boxes',weight:510,cbm:1.8,length:1.3,width:.9,height:.77,location:'B-12-2',handling:'Depalletize',palletHT:false,stackable:true,maxStack:3,loading:'Not loaded',dg:false,docs:{invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null},notes:'Customer sending revised SLI.'},{id:'WR-1008',pieces:6,packages:'Boxes',weight:220,cbm:.7,length:1,width:.7,height:.5,location:'B-12-3',handling:'Complete',palletHT:true,stackable:true,maxStack:3,loading:'Ready',dg:false,docs:{invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null},notes:''}]},{id:'S2',name:'Miami Parts',aesStatus:'Filed',itn:'X20260806123456',wrs:[{id:'WR-1020',pieces:1,packages:'Pallet',weight:740,cbm:2.3,length:1.2,width:1,height:1.92,location:'C-04-1',handling:'Complete',palletHT:true,stackable:false,maxStack:1,loading:'Ready',dg:true,docs:{invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null},notes:'UN3481 Class 9. Keep upright.'}]}]},{id:'H2',hbl:'HBL-002',consignee:'Comercial Quito',notify:'Logística Andina',shippers:[{id:'S3',name:'Global Equipment',aesStatus:'Missing Schedule B',itn:'',wrs:[{id:'WR-1040',pieces:2,packages:'Pallets',weight:1480,cbm:4.9,length:2.2,width:1.1,height:1.01,location:'D-10-1',handling:'Repalletize',palletHT:true,stackable:true,maxStack:2,loading:'Loading',dg:false,docs:{invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null},notes:'Repalletize to two HT pallets.'},{id:'WR-1045',pieces:9,packages:'Crates',weight:880,cbm:3.1,length:1.6,width:1,height:1.94,location:'D-10-2',handling:'Inspect',palletHT:false,stackable:false,maxStack:1,loading:'Not loaded',dg:false,docs:{invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null},notes:'Verify crate markings before load.'}]}]}],loadPlan:{}}],templates:[{id:'T1',name:'Master Shipping Instructions',subject:'Shipping Instructions – {{booking}}',body:'Dear Documentation Team,\n\nPlease find our shipping instructions for booking {{booking}}.\nCarrier: {{carrier}}\nVessel/Voyage: {{vessel}} / {{voyage}}\nRoute: {{route}}\nTotal Houses: {{houses}}\nTotal Pieces: {{pieces}}\nTotal Weight: {{weight}} lb\nTotal Measurement: {{cbm}} CBM\n\nKindly confirm receipt and send the draft bill for review.\n\nBest regards,'}]};
let state=load(),screen='shipments',activeShipmentId=null,tab='summary',activeTemplate='T1',viewer={yaw:-.58,pitch:.34,selected:null};
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY))||clone(sample))}catch{return clone(sample)}}function migrate(x){x.shipments?.forEach(s=>{s.capacityCBM??=52;s.loadPlan??={};s.houses?.forEach(h=>h.shippers?.forEach(p=>p.wrs?.forEach(w=>{w.docs??={invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null};Object.keys(w.docs).forEach(k=>{if(w.docs[k]===true)w.docs[k]={name:k.toUpperCase()+' marked complete',stored:false};if(w.docs[k]===false)w.docs[k]=null});w.maxStack??=w.stackable===false?1:2})))});return x}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),2300)}const toastEl=document.getElementById('toast');
function shipment(id){return state.shipments.find(s=>s.id===id)}function wrs(s){return s.houses.flatMap(h=>h.shippers.flatMap(p=>p.wrs.map(w=>({w,h,p}))))}function totals(s){const a=wrs(s);return{houses:s.houses.length,wrs:a.length,pieces:a.reduce((n,x)=>n+(+x.w.pieces||0),0),weight:a.reduce((n,x)=>n+(+x.w.weight||0),0),cbm:a.reduce((n,x)=>n+(+x.w.cbm||0),0)}}function remaining(s){return Math.max(0,(+s.capacityCBM||52)-totals(s).cbm)}function badge(t){let c='gray';if(/filed|ready|complete|loaded|accept/i.test(t))c='green';else if(/missing|held|not loaded|full|invalid/i.test(t))c='red';else if(/loading|planning/i.test(t))c='blue';else if(/prepare|inspect|repalletize|depalletize|attention/i.test(t))c='amber';return `<span class="pill ${c}">${esc(t)}</span>`}function docDone(w,k){return !!w.docs?.[k]}function missingDocs(w){const req=w.dg?['invoice','packing','sli','sds','imo']:['invoice','packing','sli'];return req.filter(k=>!docDone(w,k))}function issues(s){const out=[];wrs(s).forEach(({w,h,p})=>{const m=missingDocs(w);if(m.length)out.push({type:'docs',label:`${w.id} missing ${m.join(', ').toUpperCase()}`,sub:`${h.hbl} · ${p.name}`,wr:w});if(w.handling!=='Complete')out.push({type:'warehouse',label:`${w.handling}: ${w.id}`,sub:`${h.hbl} · ${p.name}`,wr:w})});s.houses.forEach(h=>h.shippers.forEach(p=>{if(p.aesStatus!=='Filed')out.push({type:'aes',label:`AES ${p.aesStatus}: ${p.name}`,sub:`${h.hbl} · ${p.wrs.length} WR(s)`})}));return out}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===screen));app.innerHTML=screen==='shipments'?shipmentsView():screen==='cargo'?cargoView():screen==='workspace'?workspaceView():screen==='attention'?attentionView():templatesView();bind();if(screen==='workspace'&&tab==='loading')setTimeout(()=>initPlanner(shipment(activeShipmentId)),20)}
function shipmentsView(){return `<div class="top"><div><h1>Ocean Shipments</h1><p>Start with the weekly consolidation.</p></div><button class="btn primary" id="newShipment">+ New shipment</button></div><div class="shipment-list">${state.shipments.map(s=>{const t=totals(s),p=Math.min(100,t.cbm/(+s.capacityCBM||52)*100);return `<div class="card shipment-card"><div class="shipment-title"><div class="week"><div><small>WEEK</small>${s.week}</div></div><div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.booking)} · ${esc(s.carrier)} · ${esc(s.route)}</div><div class="meta">${badge(s.status)}${badge(remaining(s)<=0?'Full':remaining(s).toFixed(1)+' CBM left')}</div></div></div><div><strong>${t.cbm.toFixed(1)} / ${s.capacityCBM} CBM</strong><div class="progress"><span style="width:${p}%;background:${p>92?'#d92d20':p>80?'#f79009':'#1677ff'}"></span></div><small class="muted">${t.houses} Houses · ${t.wrs} WRs · ${t.pieces} pieces</small></div><button class="btn primary openShipment" data-id="${s.id}">Open</button></div>`}).join('')}</div>`}
function cargoView(){return `<div class="top"><div><h1>Cargo on Hand</h1><p>Magaya WR inbox. Capacity is checked automatically.</p></div></div><div class="card panel"><div class="table-wrap mobile-cards"><table class="summary-table"><thead><tr><th>WR</th><th>Shipper</th><th>Consignee</th><th>CBM</th><th>Location</th><th>Assign</th></tr></thead><tbody>${state.cargoPool.map(c=>`<tr><td data-label="WR"><strong>${c.id}</strong></td><td data-label="Shipper">${esc(c.shipper)}</td><td data-label="Consignee">${esc(c.consignee)}</td><td data-label="CBM">${(+c.cbm||0).toFixed(2)}</td><td data-label="Location">${esc(c.location)}</td><td data-label="Assign">${c.assignedShipmentId?badge('Assigned'):`<div class="cargo-actions"><select data-sel="${c.id}">${state.shipments.map(s=>`<option value="${s.id}">W${s.week} · ${remaining(s).toFixed(1)} left</option>`).join('')}</select><button class="btn small primary assign" data-wr="${c.id}">Add</button></div>`}</td></tr>`).join('')}</tbody></table></div></div>`}
function assignCargo(id,sid){const c=state.cargoPool.find(x=>x.id===id),s=shipment(sid);if(!c||!s)return;if((+c.cbm||0)>remaining(s)+.0001){const alt=state.shipments.find(x=>x.id!==s.id&&!c.assignedShipmentId&&(+c.cbm||0)<=remaining(x)+.0001);toast(`${c.id} does not fit W${s.week}.${alt?' Try W'+alt.week+'.':''}`);return}let h=s.houses.find(x=>x.consignee.toLowerCase()===c.consignee.toLowerCase());if(!h){h={id:'H'+Date.now(),hbl:'Pending',consignee:c.consignee,notify:'Same as consignee',shippers:[]};s.houses.push(h)}let p=h.shippers.find(x=>x.name.toLowerCase()===c.shipper.toLowerCase());if(!p){p={id:'S'+Date.now(),name:c.shipper,aesStatus:'Pending documents',itn:'',wrs:[]};h.shippers.push(p)}p.wrs.push({...c,handling:'Complete',palletHT:false,stackable:true,maxStack:2,loading:'Not loaded',dg:false,docs:{invoice:null,packing:null,sli:null,sds:null,imo:null,aes:null},notes:'Imported from Magaya.'});c.assignedShipmentId=s.id;save();toast(`${id} added to Week ${s.week}.`);render()}

function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function storeDoc(wr,type,file){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,wr+'|'+type);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function deleteDoc(wr,type){const db=await openDB();const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(wr+'|'+type)}async function downloadDoc(wr,type,name){const db=await openDB();const q=db.transaction('files').objectStore('files').get(wr+'|'+type);q.onsuccess=()=>{if(!q.result)return toast('File is not stored in this browser.');const a=document.createElement('a');a.href=URL.createObjectURL(q.result);a.download=name||type;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}}
function colorFor(i){return['#2e90fa','#12b76a','#f79009','#7f56d9','#f04438','#06aed4','#ee46bc','#84cc16'][i%8]}function getPlan(s,w,i){s.loadPlan??={};if(!s.loadPlan[w.id])s.loadPlan[w.id]={x:.15+(i%4)*1.4,z:.12+Math.floor(i%2)*1.05,tier:0,rotated:false,locked:false};return s.loadPlan[w.id]}function dims(w,p){let l=+w.length||Math.cbrt(Math.max(.05,+w.cbm||.1)),ww=+w.width||l,h=+w.height||Math.max(.2,(+w.cbm||.1)/(l*ww));return p.rotated?{l:ww,w:l,h}:{l,w:ww,h}}

function actUnit(s,id,act){const list=wrs(s),i=list.findIndex(x=>x.w.id===id),u=list[i];if(!u)return;const p=getPlan(s,u.w,i),step=.15;if(p.locked&&act!=='lock'&&act!=='select')return toast('Unlock this unit first.');if(act==='rotate')p.rotated=!p.rotated;if(act==='forward')p.x=Math.max(0,p.x-step);if(act==='back')p.x+=step;if(act==='left')p.z=Math.max(0,p.z-step);if(act==='right')p.z+=step;if(act==='lock')p.locked=!p.locked;if(act==='select')viewer.selected=id;save();render()}
function initPlanner(s){const c=document.getElementById('loadCanvas');if(!c)return,ctx=c.getContext('2d');let drag=false,lx=0,ly=0;const units=wrs(s);function resize(){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}function rot(P){let x=P.x-CONTAINER.length/2,y=P.y-CONTAINER.height/2,z=P.z-CONTAINER.width/2,cy=Math.cos(viewer.yaw),sy=Math.sin(viewer.yaw),cp=Math.cos(viewer.pitch),sp=Math.sin(viewer.pitch),x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cp-z1*sp,z2=y*sp+z1*cp;return{x:x1,y:y1,z:z2}}function proj(P){const q=rot(P),r=c.getBoundingClientRect(),sc=Math.min(r.width/14,r.height/6.5),pe=1/(1+q.z/22);return{x:r.width/2+q.x*sc*pe,y:r.height*.57-q.y*sc*pe,z:q.z}}function box(x,y,z,l,h,w,color,fill){const v=[{x,y,z},{x:x+l,y,z},{x:x+l,y:y+h,z},{x,y:y+h,z},{x,y,z:z+w},{x:x+l,y,z:z+w},{x:x+l,y:y+h,z:z+w},{x,y:y+h,z:z+w}],p=v.map(proj),faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[1,2,6,5],[0,3,7,4]];faces.map(f=>({f,z:f.reduce((n,k)=>n+p[k].z,0)})).sort((a,b)=>b.z-a.z).forEach(o=>{ctx.beginPath();o.f.forEach((k,n)=>n?ctx.lineTo(p[k].x,p[k].y):ctx.moveTo(p[k].x,p[k].y));ctx.closePath();if(fill){ctx.fillStyle=color+'ba';ctx.fill()}ctx.strokeStyle=fill?'rgba(255,255,255,.55)':color;ctx.lineWidth=fill?1:1.4;ctx.stroke()})}function draw(){resize();const r=c.getBoundingClientRect(),g=ctx.createLinearGradient(0,0,0,r.height);g.addColorStop(0,'#0b1220');g.addColorStop(1,'#14213a');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);box(0,0,0,CONTAINER.length,CONTAINER.height,CONTAINER.width,'#42d3ff',false);units.forEach((u,i)=>{const p=getPlan(s,u.w,i),d=dims(u.w,p),y=p.tier*d.h,col=viewer.selected===u.w.id?'#ffffff':colorFor(i);box(p.x,y,p.z,d.l,d.h,d.w,col,true)});ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Doors →',r.width-62,r.height-14)}c.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;viewer.yaw+=(e.clientX-lx)*.008;viewer.pitch=Math.max(-1,Math.min(1,viewer.pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;draw()};c.onpointerup=()=>drag=false;resetView.onclick=()=>{viewer.yaw=-.58;viewer.pitch=.34;draw()};draw()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{screen=b.dataset.nav;render()});document.querySelectorAll('.openShipment').forEach(b=>b.onclick=()=>{activeShipmentId=b.dataset.id;screen='workspace';tab='summary';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('.editWr').forEach(b=>b.onclick=()=>openWR(b.dataset.wr));document.querySelectorAll('.assign').forEach(b=>b.onclick=()=>assignCargo(b.dataset.wr,document.querySelector(`[data-sel="${b.dataset.wr}"]`).value));document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{activeTemplate=b.dataset.template;render()});document.querySelectorAll('.unitAct').forEach(b=>b.onclick=()=>actUnit(shipment(activeShipmentId),b.dataset.wr,b.dataset.act));document.querySelectorAll('.stackSelect').forEach(s=>s.onchange=()=>{const sh=shipment(activeShipmentId),u=wrs(sh).find(x=>x.w.id===s.dataset.wr),i=wrs(sh).indexOf(u);getPlan(sh,u.w,i).tier=+s.value;save();render()});if(document.getElementById('autoPack'))autoPack.onclick=()=>{autoPack(shipment(activeShipmentId));render()};if(document.getElementById('resetPlan'))resetPlan.onclick=()=>{shipment(activeShipmentId).loadPlan={};save();render()};if(document.getElementById('back'))back.onclick=()=>{screen='shipments';activeShipmentId=null;render()};if(document.getElementById('newShipment'))newShipment.onclick=()=>{const week=Math.max(0,...state.shipments.map(s=>+s.week||0))+1;state.shipments.push({id:'SH'+Date.now(),week,name:`Ecuador Consolidation – Week ${week}`,booking:'Pending',carrier:'',route:'Miami → Guayaquil',vessel:'TBD',voyage:'TBD',etd:'',status:'Planning',equipment:'40 NOR',capacityCBM:52,cutoffs:{},houses:[],loadPlan:{}});save();render()};if(document.getElementById('saveSetup'))saveSetup.onclick=()=>{const s=shipment(activeShipmentId);document.querySelectorAll('[data-setup]').forEach(i=>s[i.dataset.setup]=['week','capacityCBM'].includes(i.dataset.setup)?+i.value:i.value);save();render()};if(document.getElementById('copy'))copy.onclick=()=>navigator.clipboard.writeText(output.textContent).then(()=>toast('Copied.'));if(document.getElementById('email'))email.onclick=()=>location.href=`mailto:?subject=${encodeURIComponent(subject.value)}&body=${encodeURIComponent(output.textContent)}`}
render();
</script>
