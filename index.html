<body>

<script>
const KEY='consolidatedOS_v5';
const CONTAINER={name:'40 NOR',length:11.56,width:2.29,height:2.40,targetCBM:52,maxWeightLb:50000};
const sample={lastMagayaSync:'2026-08-07T06:00',cargoPool:[

{id:'SH32',week:32,name:'Ecuador Consolidation – Week 32',booking:'BK-45892',carrier:'Seaboard Marine',route:'Miami → Guayaquil',vessel:'Ocean Star',voyage:'112S',etd:'2026-08-14',status:'Preparing',equipment:'40 NOR',capacityCBM:52,cutoffs:{si:'2026-08-11T12:00',aes:'2026-08-11T17:00',vgm:'2026-08-12T10:00',cargo:'2026-08-12T15:00'},houses:[{id:'H1',hbl:'HBL-001',consignee:'Importadora Ecuador',notify:'Same as consignee',shippers:[{id:'S1',name:'ABC Tools',aesStatus:'Ready to file',itn:'',wrs:[{id:'WR-1001',pieces:12,packages:'Boxes',weight:510,cbm:1.8,length:1.3,width:.9,height:1.54,location:'B-12-2',handling:'Depalletize',palletHT:false,stackable:true,loading:'Not loaded',dg:false,docs:{invoice:true,packing:true,sli:false,sds:false,imo:false,aes:false},notes:'Customer sending revised SLI.'},{id:'WR-1008',pieces:6,packages:'Boxes',weight:220,cbm:.7,length:1,width:.7,height:1,location:'B-12-3',handling:'Complete',palletHT:true,stackable:true,loading:'Ready',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:''}]},{id:'S2',name:'Miami Parts',aesStatus:'Filed',itn:'X20260806123456',wrs:[{id:'WR-1020',pieces:1,packages:'Pallet',weight:740,cbm:2.3,length:1.2,width:1,height:1.92,location:'C-04-1',handling:'Complete',palletHT:true,stackable:false,loading:'Ready',dg:true,docs:{invoice:true,packing:true,sli:true,sds:true,imo:true,aes:true},notes:'UN3481 Class 9. Keep upright.'}]}]},{id:'H2',hbl:'HBL-002',consignee:'Comercial Quito',notify:'Logística Andina',shippers:[{id:'S3',name:'Global Equipment',aesStatus:'Missing Schedule B',itn:'',wrs:[{id:'WR-1040',pieces:2,packages:'Pallets',weight:1480,cbm:4.9,length:2.2,width:1.1,height:2.02,location:'D-10-1',handling:'Repalletize',palletHT:true,stackable:false,loading:'Loading',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:'Repalletize to two HT pallets.'},{id:'WR-1045',pieces:9,packages:'Crates',weight:880,cbm:3.1,length:1.6,width:1,height:1.94,location:'D-10-2',handling:'Inspect',palletHT:false,stackable:false,loading:'Not loaded',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:'Verify crate markings before load.'}]}]}]},
{id:'SH33',week:33,name:'Ecuador Consolidation – Week 33',booking:'Pending',carrier:'Seaboard Marine',route:'Miami → Guayaquil',vessel:'TBD',voyage:'TBD',etd:'2026-08-21',status:'Planning',equipment:'40 NOR',capacityCBM:52,cutoffs:{si:'2026-08-18T12:00',aes:'2026-08-18T17:00',vgm:'2026-08-19T10:00',cargo:'2026-08-19T15:00'},houses:[]}],templates:[{id:'T1',name:'Master Shipping Instructions',subject:'Shipping Instructions – {{booking}}',body:'Dear Documentation Team,\n\nPlease find our shipping instructions for booking {{booking}}.\n\nCarrier: {{carrier}}\nVessel/Voyage: {{vessel}} / {{voyage}}\nRoute: {{route}}\nETD: {{etd}}\nTotal Houses: {{houses}}\nTotal Pieces: {{pieces}}\nTotal Weight: {{weight}} lb\nTotal Measurement: {{cbm}} CBM\n\nPlease issue freight prepaid and telex release. Kindly confirm receipt and send the draft bill for review.\n\nBest regards,'},{id:'T2',name:'Cutoff Extension',subject:'Cutoff Extension – {{booking}}',body:'Dear Documentation Team,\n\nPlease grant an extension for booking {{booking}}.\n\nCurrent SI cutoff: {{si_cutoff}}\nVessel/Voyage: {{vessel}} / {{voyage}}\n\nPlease confirm the latest acceptable submission time.\n\nBest regards,'}]};
let state=load(),screen='shipments',activeShipmentId=null,tab='summary',activeTemplate='T1',cargoFilter='unassigned',viewerState={yaw:-.55,pitch:.35,wire:true};
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(sample)}catch{return clone(sample)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toastMsg(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>t.classList.remove('show'),2600)}
function shipment(id){return state.shipments.find(s=>s.id===id)}function wrs(s){return s.houses.flatMap(h=>h.shippers.flatMap(p=>p.wrs.map(w=>({w,h,p}))))}function totals(s){const a=wrs(s);return{houses:s.houses.length,wrs:a.length,pieces:a.reduce((n,x)=>n+(+x.w.pieces||0),0),weight:a.reduce((n,x)=>n+(+x.w.weight||0),0),cbm:a.reduce((n,x)=>n+(+x.w.cbm||0),0)}}function remaining(s){return Math.max(0,(+s.capacityCBM||52)-totals(s).cbm)}function pct(s){return Math.min(100,totals(s).cbm/(+s.capacityCBM||52)*100)}
function missingDocs(w){const req=w.dg?['invoice','packing','sli','sds','imo']:['invoice','packing','sli'];return req.filter(k=>!w.docs[k])}function issues(s){const a=[];wrs(s).forEach(({w,h,p})=>{const m=missingDocs(w);if(m.length)a.push({type:'docs',label:`${w.id} missing ${m.join(', ').toUpperCase()}`,sub:`${h.hbl} · ${p.name}`,wr:w});if(w.handling!=='Complete')a.push({type:'warehouse',label:`${w.handling}: ${w.id}`,sub:`${h.hbl} · ${p.name}`,wr:w});if(['Not loaded','Held'].includes(w.loading))a.push({type:'loading',label:`${w.id} is ${w.loading}`,sub:`${h.hbl} · ${p.name}`,wr:w})});s.houses.forEach(h=>h.shippers.forEach(p=>{if(p.aesStatus!=='Filed')a.push({type:'aes',label:`AES ${p.aesStatus}: ${p.name}`,sub:`${h.hbl} · ${p.wrs.length} WR(s)`})}));return a}
function badge(t){let c='gray';if(/filed|ready|complete|loaded|assigned/i.test(t))c='green';else if(/missing|held|not loaded|full|blocked/i.test(t))c='red';else if(/loading|planning|sync/i.test(t))c='blue';else if(/prepare|inspect|repalletize|depalletize|attention/i.test(t))c='amber';return `<span class="pill ${c}">${esc(t)}</span>`}function fmt(d){return d?new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—'}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===screen));document.getElementById('app').innerHTML=screen==='shipments'?shipmentsView():screen==='cargo'?cargoView():screen==='workspace'?workspaceView():screen==='attention'?attentionView():templatesView();bind();if(screen==='workspace'&&tab==='loading')setTimeout(()=>initViewer(shipment(activeShipmentId)),30)}
function shipmentsView(){return `<div class="top"><div><h1>Ocean Shipments</h1><p>Open the weekly consolidation first. Everything else lives inside it.</p></div><div class="actions"><button class="btn" id="reset">Reset sample</button><button class="btn primary" id="newShipment">+ New shipment</button></div></div>${state.cargoPool.some(c=>!c.assignedShipmentId)?`<div class="notice"><strong>${state.cargoPool.filter(c=>!c.assignedShipmentId).length} WRs waiting in Cargo on Hand</strong>Assign them to a shipment; capacity is checked automatically.</div>`:''}<div class="shipment-list">${state.shipments.map(s=>{const t=totals(s),p=pct(s),full=remaining(s)<=.01;return `<div class="card shipment-card"><div class="shipment-title"><div class="week"><div><small>WEEK</small>${s.week}</div></div><div style="min-width:0"><h3>${esc(s.name)}</h3><div class="muted">${esc(s.booking)} · ${esc(s.carrier)} · ${esc(s.route)}</div><div class="meta">${badge(s.status)}${badge(full?'Full':`${remaining(s).toFixed(1)} CBM left`)}<span class="pill gray">ETD ${esc(s.etd||'TBD')}</span></div></div></div><div class="capacity"><div style="display:flex;justify-content:space-between"><strong>${t.cbm.toFixed(1)} / ${(+s.capacityCBM||52).toFixed(0)} CBM</strong><span class="muted">${p.toFixed(0)}%</span></div><div class="progress"><span style="width:${p}%;background:${p>=95?'#d92d20':p>=80?'#f79009':'#0f62fe'}"></span></div><small class="muted">${t.houses} Houses · ${t.wrs} WRs · ${t.pieces} pieces · ${t.weight.toLocaleString()} lb</small></div><button class="btn primary openShipment" data-id="${s.id}">Open</button></div>`}).join('')}</div>`}
function cargoView(){const list=state.cargoPool.filter(c=>cargoFilter==='all'||(cargoFilter==='assigned'?c.assignedShipmentId:!c.assignedShipmentId));return `<div class="top"><div><h1>Cargo on Hand</h1><p>Magaya inbox. Choose a shipment and Add; the app decides if it fits.</p></div><div>${badge('Synced '+fmt(state.lastMagayaSync))}</div></div><div class="card panel" style="margin-bottom:12px"><div class="searchbar"><input id="cargoSearch" placeholder="Search WR, shipper, consignee, location"><select id="cargoFilter"><option value="unassigned" ${cargoFilter==='unassigned'?'selected':''}>Unassigned</option><option value="assigned" ${cargoFilter==='assigned'?'selected':''}>Assigned</option><option value="all" ${cargoFilter==='all'?'selected':''}>All</option></select><button class="btn" id="toggleImport">Import Magaya CSV</button></div><div id="importArea" class="import-box hidden"><input type="file" id="csvFile" accept=".csv,text/csv"><button class="btn primary" id="importCsv">Import</button></div><div class="table-wrap mobile-cards"><table class="summary-table"><thead><tr><th>WR</th><th>Shipper</th><th>Consignee</th><th>Cargo</th><th>Weight</th><th>Location</th><th>Action</th></tr></thead><tbody>${list.map(c=>cargoRow(c)).join('')||'<tr><td>No cargo in this view.</td></tr>'}</tbody></table></div></div>`}
function cargoRow(c){const s=c.assignedShipmentId?shipment(c.assignedShipmentId):null;return `<tr data-cargo-row data-search="${esc((c.id+' '+c.shipper+' '+c.consignee+' '+c.location).toLowerCase())}"><td data-label="WR"><strong>${esc(c.id)}</strong></td><td data-label="Shipper">${esc(c.shipper)}</td><td data-label="Consignee">${esc(c.consignee)}</td><td data-label="Cargo">${c.pieces} ${esc(c.packages)} · ${(+c.cbm||0).toFixed(2)} CBM</td><td data-label="Weight">${(+c.weight||0).toLocaleString()} lb</td><td data-label="Location">${esc(c.location||'—')}</td><td data-label="Action">${s?`${badge('Assigned')} Week ${s.week}`:`<div class="cargo-actions"><select data-assign-select="${c.id}">${state.shipments.map(x=>`<option value="${x.id}">W${x.week} · ${remaining(x).toFixed(1)} CBM left</option>`).join('')}</select><button class="btn small primary assignCargo" data-wr="${c.id}">Add</button></div>`}</td></tr>`}
function capacityDecision(c,s){const now=totals(s).cbm,cap=+s.capacityCBM||52,next=now+(+c.cbm||0);return{fits:next<=cap+.0001,now,next,cap,left:cap-next}}
function assignCargo(id,sid){const c=state.cargoPool.find(x=>x.id===id),s=shipment(sid);if(!c||!s)return;const d=capacityDecision(c,s);if(!d.fits){const alt=state.shipments.filter(x=>x.id!==s.id&&!c.assignedShipmentId).find(x=>capacityDecision(c,x).fits);toastMsg(`${c.id} does not fit W${s.week}: ${d.next.toFixed(1)} > ${d.cap.toFixed(1)} CBM.${alt?' Try Week '+alt.week+'.':' Create the next shipment.'}`);return}let h=s.houses.find(x=>x.consignee.toLowerCase()===c.consignee.toLowerCase());if(!h){h={id:'H'+Date.now(),hbl:'Pending',consignee:c.consignee,notify:'Same as consignee',shippers:[]};s.houses.push(h)}let p=h.shippers.find(x=>x.name.toLowerCase()===c.shipper.toLowerCase());if(!p){p={id:'S'+Date.now(),name:c.shipper,aesStatus:'Pending documents',itn:'',wrs:[]};h.shippers.push(p)}p.wrs.push({id:c.id,pieces:+c.pieces||0,packages:c.packages||'Pieces',weight:+c.weight||0,cbm:+c.cbm||0,length:+c.length||0,width:+c.width||0,height:+c.height||0,location:c.location||'',handling:'Complete',palletHT:false,stackable:true,loading:'Not loaded',dg:false,docs:{invoice:false,packing:false,sli:false,sds:false,imo:false,aes:false},notes:`Imported from Magaya. Received ${c.received||'—'}.`});c.assignedShipmentId=s.id;save();toastMsg(`${c.id} added to Week ${s.week}. ${d.left.toFixed(1)} CBM remaining.`);render()}
function workspaceView(){const s=shipment(activeShipmentId);if(!s){screen='shipments';return shipmentsView()}const tabs=[['summary','Master'],['houses','Houses'],['warehouse','Warehouse'],['documents','Docs & AES'],['loading','Loading / 3D'],['instructions','Instructions'],['setup','Setup']];return `<div class="workspace-head card"><div class="workspace-row"><div><button class="btn small" id="backShipments">← Shipments</button><h2>${esc(s.name)}</h2><div class="muted">Booking ${esc(s.booking)} · ${esc(s.carrier)} · ${esc(s.vessel)} / ${esc(s.voyage)} · ETD ${esc(s.etd)}</div></div><div class="actions">${badge(s.status)}${badge(`${totals(s).cbm.toFixed(1)}/${(+s.capacityCBM||52)} CBM`)}</div></div><div class="tabs">${tabs.map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</div></div>${tab==='summary'?summaryView(s):tab==='houses'?housesView(s):tab==='warehouse'?warehouseView(s):tab==='documents'?documentsView(s):tab==='loading'?loadingView(s):tab==='instructions'?instructionsView(s):setupView(s)}`}
function summaryView(s){const t=totals(s),i=issues(s),p=pct(s);return `<div class="metrics"><div class="metric card"><small>Houses</small><strong>${t.houses}</strong></div><div class="metric card"><small>WRs</small><strong>${t.wrs}</strong></div><div class="metric card"><small>Pieces</small><strong>${t.pieces}</strong></div><div class="metric card"><small>Weight</small><strong>${t.weight.toLocaleString()}</strong></div><div class="metric card"><small>Capacity</small><strong>${p.toFixed(0)}%</strong></div></div><div class="grid two"><div class="card panel"><h3>Master cargo summary</h3><div class="table-wrap mobile-cards"><table class="summary-table"><thead><tr><th>House</th><th>Consignee</th><th>Shippers</th><th>WRs</th><th>Pieces</th><th>CBM</th><th>Status</th></tr></thead><tbody>${s.houses.map(h=>{const a=h.shippers.flatMap(p=>p.wrs),bad=h.shippers.some(p=>p.aesStatus!=='Filed')||a.some(w=>missingDocs(w).length||w.handling!=='Complete');return `<tr><td data-label="House"><strong>${h.hbl}</strong></td><td data-label="Consignee">${esc(h.consignee)}</td><td data-label="Shippers">${h.shippers.length}</td><td data-label="WRs">${a.length}</td><td data-label="Pieces">${a.reduce((n,w)=>n+(+w.pieces||0),0)}</td><td data-label="CBM">${a.reduce((n,w)=>n+(+w.cbm||0),0).toFixed(2)}</td><td data-label="Status">${badge(bad?'Attention':'Ready')}</td></tr>`}).join('')||'<tr><td>No Houses yet.</td></tr>'}</tbody></table></div></div><div class="grid"><div class="card panel"><h3>Capacity</h3><div class="capacity-ring"><div class="capacity-box"><div class="ring" style="--p:${p}"></div><div class="ring-label" style="inset:0;display:grid;place-items:center">${p.toFixed(0)}%</div></div><div><strong>${t.cbm.toFixed(1)} / ${(+s.capacityCBM||52).toFixed(1)} CBM</strong><div class="muted">${remaining(s).toFixed(1)} CBM remaining</div><div style="margin-top:6px">${badge(remaining(s)<=0?'Full':p>=90?'Almost full':'Accepting cargo')}</div></div></div></div><div class="card panel"><h3>Needs attention</h3><div class="attention-list">${i.slice(0,6).map(x=>`<div class="attention ${x.type==='docs'||x.type==='aes'?'redline':''}"><div><strong>${esc(x.label)}</strong><small>${esc(x.sub)}</small></div>${x.wr?`<button class="btn small editWr" data-wr="${x.wr.id}">Open</button>`:''}</div>`).join('')||'<span class="muted">Everything clear.</span>'}</div></div></div></div>`}
function housesView(s){return `<div class="top"><div><h1 style="font-size:21px">Houses</h1><p>House = consignee. Shippers group their WRs and AES filing inside the House.</p></div><button class="btn" id="goCargo">+ Add WR</button></div><div class="grid">${s.houses.map(h=>`<div class="card house"><div class="house-head"><div><h3>${esc(h.hbl)} · ${esc(h.consignee)}</h3><div class="muted">Notify: ${esc(h.notify)}</div></div><span class="pill gray">${h.shippers.length} shippers</span></div>${h.shippers.map(p=>`<div class="shipper"><div class="shipper-top"><div><strong>${esc(p.name)}</strong><div class="muted">${p.wrs.length} WR(s) · ITN ${esc(p.itn||'not assigned')}</div></div>${badge(p.aesStatus)}</div>${p.wrs.map(w=>`<div class="wr-row"><button class="btn small editWr" data-wr="${w.id}">${w.id}</button><span>${w.pieces} ${esc(w.packages)}</span><span>${(+w.cbm||0).toFixed(2)} CBM</span><span>${esc(w.location)}</span><div class="docdots">${['invoice','packing','sli','sds','imo'].map(k=>`<span title="${k}" class="dot ${w.docs[k]?'ok':(w.dg||['invoice','packing','sli'].includes(k)?'bad':'')}"></span>`).join('')}</div>${badge(w.loading)}</div>`).join('')}</div>`).join('')}</div>`).join('')||'<div class="card panel muted">No Houses yet.</div>'}</div>`}
function warehouseView(s){const a=wrs(s);return `<div class="quickbar" style="margin-bottom:10px"><button class="quick warn" data-qfilter="Depalletize">Depalletize ${a.filter(x=>x.w.handling==='Depalletize').length}</button><button class="quick warn" data-qfilter="Repalletize">Repalletize ${a.filter(x=>x.w.handling==='Repalletize').length}</button><button class="quick warn" data-qfilter="Inspect">Inspect ${a.filter(x=>x.w.handling==='Inspect').length}</button><button class="quick good" data-qfilter="Complete">Complete ${a.filter(x=>x.w.handling==='Complete').length}</button></div><div class="card panel"><h3>Warehouse work</h3><div class="table-wrap mobile-cards"><table class="summary-table"><thead><tr><th>WR</th><th>House</th><th>Shipper</th><th>Location</th><th>Action</th><th>HT</th><th>Loading</th></tr></thead><tbody>${a.map(x=>`<tr data-wh="${x.w.handling}"><td data-label="WR"><button class="btn small editWr" data-wr="${x.w.id}">${x.w.id}</button></td><td data-label="House">${x.h.hbl}</td><td data-label="Shipper">${esc(x.p.name)}</td><td data-label="Location">${esc(x.w.location)}</td><td data-label="Action">${badge(x.w.handling)}</td><td data-label="HT">${x.w.palletHT?'Yes':'No'}</td><td data-label="Loading">${badge(x.w.loading)}</td></tr>`).join('')}</tbody></table></div></div>`}
function documentsView(s){return `<div class="card panel"><h3>Shipper filing groups</h3><div class="table-wrap mobile-cards"><table class="summary-table"><thead><tr><th>House</th><th>Shipper</th><th>WRs</th><th>Invoices</th><th>SLI</th><th>DG docs</th><th>AES</th><th>ITN</th></tr></thead><tbody>${s.houses.flatMap(h=>h.shippers.map(p=>{const dg=p.wrs.filter(w=>w.dg),dgok=dg.every(w=>w.docs.sds&&w.docs.imo);return `<tr><td data-label="House">${h.hbl}</td><td data-label="Shipper"><strong>${esc(p.name)}</strong></td><td data-label="WRs">${p.wrs.map(w=>w.id).join(', ')}</td><td data-label="Invoices">${p.wrs.filter(w=>w.docs.invoice).length}/${p.wrs.length}</td><td data-label="SLI">${p.wrs.filter(w=>w.docs.sli).length}/${p.wrs.length}</td><td data-label="DG">${dg.length?badge(dgok?'Complete':'Missing'):'N/A'}</td><td data-label="AES">${badge(p.aesStatus)}</td><td data-label="ITN">${esc(p.itn||'—')}</td></tr>`})).join('')}</tbody></table></div></div>`}
function loadingView(s){const t=totals(s);return `<div class="loading-layout"><div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px"><div><h3 style="margin:0">3D Loading View</h3><div class="muted">Drag to rotate. Cargo uses WR dimensions; missing dimensions are estimated from CBM.</div></div></div><div class="viewer"><canvas id="loadCanvas"></canvas><div class="viewer-tools"><div class="actions"><button class="btn small" id="resetView">Reset view</button><button class="btn small" id="wireView">Wireframe</button></div>${badge(`${t.cbm.toFixed(1)} / ${(+s.capacityCBM||52)} CBM`)}</div></div></div><div class="grid"><div class="card panel"><h3>Load status</h3><div class="metrics" style="grid-template-columns:1fr 1fr;margin:0">${[['Ready',wrs(s).filter(x=>x.w.loading==='Ready').length],['Loaded',wrs(s).filter(x=>x.w.loading==='Loaded').length],['Loading',wrs(s).filter(x=>x.w.loading==='Loading').length],['Not loaded',wrs(s).filter(x=>x.w.loading==='Not loaded').length]].map(x=>`<div class="metric" style="border:1px solid var(--line);border-radius:10px"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div></div><div class="card panel"><h3>Cargo legend</h3><div class="legend">${wrs(s).map((x,i)=>`<div class="legend-row"><span class="swatch" style="background:${colorFor(i)}"></span><div><strong>${x.w.id}</strong><small class="muted" style="display:block">${x.h.hbl} · ${esc(x.p.name)}</small></div><span>${(+x.w.cbm||0).toFixed(1)}</span></div>`).join('')}</div></div></div></div>`}
function instructionsView(s){const t=state.templates.find(x=>x.id===activeTemplate)||state.templates[0],body=fill(t.body,s);return `<div class="instruction-layout"><div class="card template-list">${state.templates.map(x=>`<button data-template="${x.id}" class="${x.id===t.id?'active':''}">${esc(x.name)}</button>`).join('')}</div><div class="card panel"><div class="actions" style="justify-content:flex-end;margin-bottom:8px"><button class="btn" id="copyInstructions">Copy</button><button class="btn primary" id="emailInstructions">Open email</button></div><div class="field"><label>Subject</label><input id="instructionSubject" value="${esc(fill(t.subject,s))}"></div><div class="output" id="instructionOutput">${esc(body)}</div></div></div>`}
function fill(text,s){const t=totals(s),m={booking:s.booking,carrier:s.carrier,vessel:s.vessel,voyage:s.voyage,route:s.route,etd:s.etd,houses:t.houses,pieces:t.pieces,weight:t.weight.toLocaleString(),cbm:t.cbm.toFixed(2),si_cutoff:fmt(s.cutoffs.si)};return Object.entries(m).reduce((a,[k,v])=>a.replaceAll(`{{${k}}}`,v),text)}
function setupView(s){return `<div class="card panel"><h3>Shipment setup</h3><div class="form-grid">${[['name','Shipment name'],['week','Week'],['booking','Booking'],['carrier','Carrier'],['route','Route'],['vessel','Vessel'],['voyage','Voyage'],['etd','ETD'],['equipment','Equipment'],['capacityCBM','Automatic CBM limit']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-setup="${k}" value="${esc(s[k]??'')}"></div>`).join('')}${Object.entries(s.cutoffs).map(([k,v])=>`<div class="field"><label>${k.toUpperCase()} cutoff</label><input type="datetime-local" data-cutoff="${k}" value="${esc(v)}"></div>`).join('')}</div><button class="btn primary" id="saveSetup" style="margin-top:10px">Save</button></div>`}
function attentionView(){const all=state.shipments.flatMap(s=>issues(s).map(i=>({s,i})));return `<div class="top"><div><h1>Attention</h1><p>Only exceptions that need someone to act.</p></div></div><div class="card panel"><div class="attention-list">${all.map(({s,i})=>`<div class="attention ${i.type==='docs'||i.type==='aes'?'redline':''}"><div><strong>${esc(i.label)}</strong><small>Week ${s.week} · ${esc(i.sub)}</small></div><button class="btn small jumpShipment" data-id="${s.id}">Open</button></div>`).join('')||'<div class="muted">Nothing needs attention.</div>'}</div></div>`}
function templatesView(){return `<div class="top"><div><h1>Templates</h1><p>Reusable carrier instructions.</p></div></div><div class="grid">${state.templates.map(t=>`<div class="card panel"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.subject)}</div><pre style="white-space:pre-wrap;color:#475467">${esc(t.body)}</pre></div>`).join('')}</div>`}
function findWR(id){for(const s of state.shipments)for(const h of s.houses)for(const p of h.shippers){const w=p.wrs.find(x=>x.id===id);if(w)return{s,h,p,w}}}
function openWR(id){const x=findWR(id);if(!x)return;document.getElementById('drawerTitle').textContent=`${x.w.id} · ${x.p.name}`;drawerBody.innerHTML=`<div class="quickbar" style="margin-bottom:12px"><button class="quick good qAct" data-act="Complete">✓ Complete handling</button><button class="quick warn qAct" data-act="Depalletize">Depalletize</button><button class="quick warn qAct" data-act="Repalletize">Repalletize</button><button class="quick qLoad" data-load="Ready">Ready to load</button><button class="quick good qLoad" data-load="Loaded">Loaded</button></div><div class="form-grid"><div class="field"><label>Pieces</label><input id="dPieces" type="number" value="${x.w.pieces}"></div><div class="field"><label>Package</label><input id="dPackages" value="${esc(x.w.packages)}"></div><div class="field"><label>Weight lb</label><input id="dWeight" type="number" value="${x.w.weight}"></div><div class="field"><label>CBM</label><input id="dCbm" type="number" step=".01" value="${x.w.cbm}"></div><div class="field"><label>Length m</label><input id="dLength" type="number" step=".01" value="${x.w.length||''}"></div><div class="field"><label>Width m</label><input id="dWidth" type="number" step=".01" value="${x.w.width||''}"></div><div class="field"><label>Height m</label><input id="dHeight" type="number" step=".01" value="${x.w.height||''}"></div><div class="field"><label>Location</label><input id="dLocation" value="${esc(x.w.location)}"></div><div class="field"><label>Handling</label><select id="dHandling">${['Complete','Depalletize','Repalletize','Inspect','Hold'].map(v=>`<option ${x.w.handling===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Loading</label><select id="dLoading">${['Not loaded','Ready','Loading','Loaded','Partial','Held'].map(v=>`<option ${x.w.loading===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>HT pallet</label><select id="dHT"><option value="false" ${!x.w.palletHT?'selected':''}>No</option><option value="true" ${x.w.palletHT?'selected':''}>Yes</option></select></div><div class="field"><label>Stackable</label><select id="dStack"><option value="true" ${x.w.stackable!==false?'selected':''}>Yes</option><option value="false" ${x.w.stackable===false?'selected':''}>No</option></select></div><div class="field full"><label>Documents</label><div class="checks">${Object.keys(x.w.docs).map(k=>`<label class="check"><input type="checkbox" data-doc="${k}" ${x.w.docs[k]?'checked':''}> ${k.toUpperCase()}</label>`).join('')}</div></div><div class="field full"><label>Notes</label><textarea id="dNotes" rows="3">${esc(x.w.notes||'')}</textarea></div></div><button class="btn primary" id="saveWR" style="width:100%;margin-top:10px">Save</button>`;drawer.classList.add('open');document.querySelectorAll('.qAct').forEach(b=>b.onclick=()=>{dHandling.value=b.dataset.act});document.querySelectorAll('.qLoad').forEach(b=>b.onclick=()=>{dLoading.value=b.dataset.load});saveWR.onclick=()=>{Object.assign(x.w,{pieces:+dPieces.value,packages:dPackages.value,weight:+dWeight.value,cbm:+dCbm.value,length:+dLength.value||0,width:+dWidth.value||0,height:+dHeight.value||0,location:dLocation.value,handling:dHandling.value,loading:dLoading.value,palletHT:dHT.value==='true',stackable:dStack.value==='true',notes:dNotes.value});document.querySelectorAll('[data-doc]').forEach(c=>x.w.docs[c.dataset.doc]=c.checked);save();closeDrawer();render()}}
function closeDrawer(){drawer.classList.remove('open')}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return[];const split=line=>{let a=[],c='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){a.push(c.trim());c=''}else c+=ch}a.push(c.trim());return a};const head=split(lines[0]).map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')),v=(r,n)=>{for(const k of n){let i=head.indexOf(k);if(i>=0)return r[i]||''}return''};return lines.slice(1).map(split).map(r=>({id:v(r,['wr','wrnumber','warehousereceipt','warehousereceiptnumber']),shipper:v(r,['shipper','supplier']),consignee:v(r,['consignee','customer']),pieces:+v(r,['pieces','pcs','quantity'])||0,packages:v(r,['packages','packagetype','package'])||'Pieces',weight:+v(r,['weight','weightlb','grossweight'])||0,cbm:+v(r,['cbm','volume'])||0,length:+v(r,['length','lengthm'])||0,width:+v(r,['width','widthm'])||0,height:+v(r,['height','heightm'])||0,location:v(r,['location','warehouselocation']),received:v(r,['receiveddate','date','received']),assignedShipmentId:'',source:'Magaya'})).filter(x=>x.id)}
function mergeCargo(items){let add=0,upd=0;items.forEach(n=>{const e=state.cargoPool.find(x=>x.id.toLowerCase()===n.id.toLowerCase());if(e){const sid=e.assignedShipmentId;Object.assign(e,n,{assignedShipmentId:sid});upd++}else{state.cargoPool.push(n);add++}});state.lastMagayaSync=new Date().toISOString();save();toastMsg(`${add} new WRs, ${upd} refreshed.`);render()}
function colorFor(i){return['#2e90fa','#12b76a','#f79009','#7f56d9','#f04438','#06aed4','#ee46bc','#84cc16'][i%8]}
function initViewer(s){const canvas=document.getElementById('loadCanvas');if(!canvas)return;const ctx=canvas.getContext('2d'),cargo=wrs(s).map((x,i)=>({...x,index:i}));let drag=false,lx=0,ly=0;function size(){const d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0)}function rot(p){let x=p.x-CONTAINER.length/2,y=p.y-CONTAINER.height/2,z=p.z-CONTAINER.width/2,cy=Math.cos(viewerState.yaw),sy=Math.sin(viewerState.yaw),cp=Math.cos(viewerState.pitch),sp=Math.sin(viewerState.pitch),x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cp-z1*sp,z2=y*sp+z1*cp;return{x:x1,y:y1,z:z2}}function proj(p){const r=rot(p),rect=canvas.getBoundingClientRect(),scale=Math.min(rect.width/14,rect.height/6.5),pers=1/(1+r.z/22);return{x:rect.width/2+r.x*scale*pers,y:rect.height*.55-r.y*scale*pers,z:r.z}}function box(x,y,z,l,h,w,color,fill=true){const v=[{x,y,z},{x:x+l,y,z},{x:x+l,y:y+h,z},{x,y:y+h,z},{x,y,z:z+w},{x:x+l,y,z:z+w},{x:x+l,y:y+h,z:z+w},{x,y:y+h,z:z+w}],p=v.map(proj),faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[1,2,6,5],[0,3,7,4]];if(fill){faces.map(f=>({f,z:f.reduce((n,i)=>n+p[i].z,0)/4})).sort((a,b)=>b.z-a.z).forEach(o=>{ctx.beginPath();o.f.forEach((i,j)=>j?ctx.lineTo(p[i].x,p[i].y):ctx.moveTo(p[i].x,p[i].y));ctx.closePath();ctx.fillStyle=color+'b8';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke()})}else{ctx.strokeStyle=color;ctx.lineWidth=1.4;[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>{ctx.beginPath();ctx.moveTo(p[e[0]].x,p[e[0]].y);ctx.lineTo(p[e[1]].x,p[e[1]].y);ctx.stroke()})}}
function layout(){let out=[],x=.15,z=.12,rowDepth=0;cargo.forEach(c=>{let l=+c.w.length||Math.cbrt(Math.max(.05,+c.w.cbm||.1)),w=+c.w.width||l,h=+c.w.height||Math.max(.25,(+c.w.cbm||.1)/(l*w));l=Math.min(l,CONTAINER.length-.3);w=Math.min(w,CONTAINER.width-.24);h=Math.min(h,CONTAINER.height-.15);if(z+w>CONTAINER.width-.08){x+=rowDepth+.12;z=.12;rowDepth=0}if(x+l>CONTAINER.length-.08){out.push({...c,x:CONTAINER.length-l-.08,z:CONTAINER.width-w-.08,l,w,h,overflow:true});return}out.push({...c,x,z,l,w,h,overflow:false});z+=w+.08;rowDepth=Math.max(rowDepth,l)});return out}
function draw(){size();const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);const grad=ctx.createLinearGradient(0,0,0,r.height);grad.addColorStop(0,'#0b1220');grad.addColorStop(1,'#121d34');ctx.fillStyle=grad;ctx.fillRect(0,0,r.width,r.height);box(0,0,0,CONTAINER.length,CONTAINER.height,CONTAINER.width,'#42d3ff',false);layout().forEach((c)=>box(c.x,0,c.z,c.l,c.h,c.w,c.overflow?'#f04438':colorFor(c.index),true));ctx.fillStyle='rgba(255,255,255,.72)';ctx.font='12px system-ui';ctx.fillText(`${CONTAINER.name} · ${CONTAINER.length} × ${CONTAINER.width} × ${CONTAINER.height} m`,12,r.height-14)}
canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;viewerState.yaw+=(e.clientX-lx)*.008;viewerState.pitch=Math.max(-1,Math.min(1,viewerState.pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;draw()};canvas.onpointerup=()=>drag=false;window.addEventListener('resize',draw,{once:true});document.getElementById('resetView').onclick=()=>{viewerState.yaw=-.55;viewerState.pitch=.35;draw()};document.getElementById('wireView').onclick=()=>{viewerState.wire=!viewerState.wire;draw()};draw()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{screen=b.dataset.nav;render()});document.querySelectorAll('.openShipment,.jumpShipment').forEach(b=>b.onclick=()=>{activeShipmentId=b.dataset.id;screen='workspace';tab='summary';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('.editWr').forEach(b=>b.onclick=()=>openWR(b.dataset.wr));document.querySelectorAll('.assignCargo').forEach(b=>b.onclick=()=>assignCargo(b.dataset.wr,document.querySelector(`[data-assign-select="${b.dataset.wr}"]`).value));document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{activeTemplate=b.dataset.template;render()});document.querySelectorAll('[data-qfilter]').forEach(b=>b.onclick=()=>document.querySelectorAll('[data-wh]').forEach(r=>r.style.display=r.dataset.wh===b.dataset.qfilter?'':'none'));if(document.getElementById('cargoFilter'))cargoFilter.onchange=e=>{cargoFilter=e.target.value;render()};if(document.getElementById('cargoSearch'))cargoSearch.oninput=e=>document.querySelectorAll('[data-cargo-row]').forEach(r=>r.style.display=r.dataset.search.includes(e.target.value.toLowerCase())?'':'none');if(document.getElementById('toggleImport'))toggleImport.onclick=()=>importArea.classList.toggle('hidden');if(document.getElementById('importCsv'))importCsv.onclick=()=>{const f=csvFile.files[0];if(!f)return toastMsg('Choose the Magaya CSV first.');const rd=new FileReader();rd.onload=()=>mergeCargo(parseCSV(rd.result));rd.readAsText(f)};if(document.getElementById('backShipments'))backShipments.onclick=()=>{screen='shipments';activeShipmentId=null;render()};if(document.getElementById('goCargo'))goCargo.onclick=()=>{screen='cargo';render()};if(document.getElementById('reset'))reset.onclick=()=>{state=clone(sample);save();render()};if(document.getElementById('newShipment'))newShipment.onclick=()=>{const week=Math.max(0,...state.shipments.map(s=>+s.week||0))+1;state.shipments.push({id:'SH'+Date.now(),week,name:`Ecuador Consolidation – Week ${week}`,booking:'Pending',carrier:'',route:'Miami → Guayaquil',vessel:'TBD',voyage:'TBD',etd:'',status:'Planning',equipment:'40 NOR',capacityCBM:52,cutoffs:{si:'',aes:'',vgm:'',cargo:''},houses:[]});save();render()};if(document.getElementById('saveSetup'))saveSetup.onclick=()=>{const s=shipment(activeShipmentId);document.querySelectorAll('[data-setup]').forEach(i=>s[i.dataset.setup]=['week','capacityCBM'].includes(i.dataset.setup)?+i.value:i.value);document.querySelectorAll('[data-cutoff]').forEach(i=>s.cutoffs[i.dataset.cutoff]=i.value);save();render()};if(document.getElementById('copyInstructions'))copyInstructions.onclick=()=>navigator.clipboard.writeText(instructionOutput.textContent).then(()=>toastMsg('Instructions copied.'));if(document.getElementById('emailInstructions'))emailInstructions.onclick=()=>location.href=`mailto:?subject=${encodeURIComponent(instructionSubject.value)}&body=${encodeURIComponent(instructionOutput.textContent)}`}
render();
</script>
