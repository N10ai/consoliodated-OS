.shipment-list{display:grid;gap:12px}.shipment-card{padding:16px;display:grid;grid-template-columns:1.5fr 1fr auto;gap:18px;align-items:center}.shipment-title{display:flex;align-items:flex-start;gap:12px}.week{width:58px;height:58px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;text-align:center;font-weight:850;line-height:1}.week small{display:block;font-size:10px;color:#9fb0c8;margin-bottom:4px}.shipment-card h3{margin:0 0 3px;font-size:18px}.muted{color:var(--muted)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.green{color:var(--green);background:var(--greenbg)}.amber{color:var(--amber);background:var(--amberbg)}.red{color:var(--red);background:var(--redbg)}.blue{color:var(--blue);background:var(--bluebg)}.gray{color:#475467;background:#f2f4f7}.progress{height:8px;background:#edf0f4;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{padding:14px}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;font-size:23px;margin-top:4px}.workspace-head{padding:16px;margin-bottom:14px}.workspace-row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.workspace-head h2{margin:0;font-size:22px}.tabs{display:flex;gap:6px;overflow:auto;padding:5px;background:#e9edf3;border-radius:12px;margin-top:14px}.tabs button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:800;white-space:nowrap;color:#596579}.tabs button.active{background:#fff;color:#111827;box-shadow:0 2px 8px rgba(16,24,40,.08)}
.grid{display:grid;gap:14px}.two{grid-template-columns:1.35fr .65fr}.three{grid-template-columns:repeat(3,1fr)}.panel{padding:16px}.panel h3{margin:0 0 12px;font-size:16px}.attention-list{display:grid;gap:8px}.attention{border:1px solid var(--line);border-left:4px solid var(--amber);padding:11px;border-radius:10px;display:flex;justify-content:space-between;gap:12px}.attention.redline{border-left-color:var(--red)}.attention strong{display:block}.attention small{color:var(--muted)}.summary-table{width:100%;border-collapse:collapse}.summary-table th,.summary-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.summary-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.table-wrap{overflow:auto}.house{overflow:hidden}.house-head{padding:15px;background:#f8fafc;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.house-head h3{margin:0}.shipper{padding:14px 16px;border-bottom:1px solid var(--line)}.shipper:last-child{border-bottom:0}.shipper-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px}.wr-row{display:grid;grid-template-columns:1.2fr .7fr .8fr .8fr 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}.docdots{display:flex;gap:4px}.dot{width:9px;height:9px;border-radius:50%;background:#d0d5dd}.dot.ok{background:#12b76a}.dot.bad{background:#f04438}.queue{display:grid;gap:10px}.queue-item{padding:12px;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:10px}.queue-item h4{margin:0 0 3px}.cutoff{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.cutoff:last-child{border-bottom:0}.instruction-layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.template-list{padding:10px}.template-list button{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:9px;font-weight:750}.template-list button.active,.template-list button:hover{background:var(--accent2);color:var(--accent)}.output{white-space:pre-wrap;background:#101828;color:#e4e7ec;padding:18px;border-radius:14px;min-height:330px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.drawer{position:fixed;inset:0 0 0 auto;width:min(590px,100%);background:#fff;z-index:20;box-shadow:-18px 0 45px rgba(16,24,40,.18);transform:translateX(100%);transition:.2s;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;background:#fff;padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:2}.drawer-body{padding:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid var(--line);padding:9px;border-radius:10px}.import-box{border:2px dashed #b9c8dd;background:#f8fbff;padding:22px;border-radius:16px;text-align:center}.import-box input{max-width:100%}.sync-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cargo-actions{display:flex;gap:6px;align-items:center}.cargo-actions select{min-width:190px;border:1px solid var(--line);border-radius:9px;padding:7px;background:#fff}.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.searchbar input,.searchbar select{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.searchbar input{flex:1;min-width:220px}.notice{padding:12px;border-radius:12px;background:var(--accent2);color:#174ea6;margin-bottom:12px}.notice strong{display:block}.nowrap{white-space:nowrap}

<div class="shell"><aside class="side"><div class="brand">Consolidated OS<small>Ocean Operations</small></div><div class="section">Work</div><button class="active" data-nav="shipments">Shipments</button><button data-nav="cargo">Cargo on Hand</button><button data-nav="all-attention">All Attention</button><div class="section">System</div><button data-nav="templates">Templates</button></aside><main class="main"><div id="app"></div></main></div>

<script>
const KEY='consolidatedOS_v4';
const sample={lastMagayaSync:'2026-08-06T20:00',cargoPool:[
{id:'WR-1060',shipper:'Pacific Tools LLC',consignee:'Importadora Ecuador',pieces:8,packages:'Boxes',weight:410,cbm:1.35,location:'A-08-2',received:'2026-08-06',assignedShipmentId:'',source:'Magaya'},
{id:'WR-1061',shipper:'Miami Parts',consignee:'Importadora Ecuador',pieces:2,packages:'Pallets',weight:980,cbm:3.4,location:'C-04-2',received:'2026-08-06',assignedShipmentId:'',source:'Magaya'},
{id:'WR-1062',shipper:'Andes Supply',consignee:'Comercial Quito',pieces:14,packages:'Cartons',weight:620,cbm:2.1,location:'E-02-1',received:'2026-08-05',assignedShipmentId:'',source:'Magaya'}],shipments:[
{id:'SH32',week:32,name:'Ecuador Consolidation – Week 32',booking:'BK-45892',carrier:'Seaboard Marine',route:'Miami → Guayaquil',vessel:'Ocean Star',voyage:'112S',etd:'2026-08-14',status:'Preparing',cutoffs:{si:'2026-08-11T12:00',aes:'2026-08-11T17:00',vgm:'2026-08-12T10:00',cargo:'2026-08-12T15:00'},houses:[{id:'H1',hbl:'HBL-001',consignee:'Importadora Ecuador',notify:'Same as consignee',shippers:[{id:'S1',name:'ABC Tools',aesStatus:'Ready to file',itn:'',wrs:[{id:'WR-1001',pieces:12,packages:'Boxes',weight:510,cbm:1.8,location:'B-12-2',handling:'Depalletize',palletHT:false,loading:'Not loaded',dg:false,docs:{invoice:true,packing:true,sli:false,sds:false,imo:false,aes:false},notes:'Customer sending revised SLI.'},{id:'WR-1008',pieces:6,packages:'Boxes',weight:220,cbm:.7,location:'B-12-3',handling:'Complete',palletHT:true,loading:'Ready',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:''}]},{id:'S2',name:'Miami Parts',aesStatus:'Filed',itn:'X20260806123456',wrs:[{id:'WR-1020',pieces:1,packages:'Pallet',weight:740,cbm:2.3,location:'C-04-1',handling:'Complete',palletHT:true,loading:'Ready',dg:true,docs:{invoice:true,packing:true,sli:true,sds:true,imo:true,aes:true},notes:'UN3481 Class 9. Keep upright.'}]}]},{id:'H2',hbl:'HBL-002',consignee:'Comercial Quito',notify:'Logística Andina',shippers:[{id:'S3',name:'Global Equipment',aesStatus:'Missing Schedule B',itn:'',wrs:[{id:'WR-1040',pieces:2,packages:'Pallets',weight:1480,cbm:4.9,location:'D-10-1',handling:'Repalletize',palletHT:true,loading:'Loading',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:'Repalletize to two HT pallets.'},{id:'WR-1045',pieces:9,packages:'Crates',weight:880,cbm:3.1,location:'D-10-2',handling:'Inspect',palletHT:false,loading:'Not loaded',dg:false,docs:{invoice:true,packing:true,sli:true,sds:false,imo:false,aes:false},notes:'Verify crate markings before load.'}]}]}]},
{id:'SH33',week:33,name:'Ecuador Consolidation – Week 33',booking:'Pending',carrier:'Seaboard Marine',route:'Miami → Guayaquil',vessel:'TBD',voyage:'TBD',etd:'2026-08-21',status:'Planning',cutoffs:{si:'2026-08-18T12:00',aes:'2026-08-18T17:00',vgm:'2026-08-19T10:00',cargo:'2026-08-19T15:00'},houses:[]}],templates:[{id:'T1',name:'Master Shipping Instructions',subject:'Shipping Instructions – {{booking}}',body:'Dear Documentation Team,\n\nPlease find our shipping instructions for booking {{booking}}.\n\nCarrier: {{carrier}}\nVessel/Voyage: {{vessel}} / {{voyage}}\nRoute: {{route}}\nETD: {{etd}}\nTotal Houses: {{houses}}\nTotal Pieces: {{pieces}}\nTotal Weight: {{weight}} lb\nTotal Measurement: {{cbm}} CBM\n\nPlease issue freight prepaid and telex release. Kindly confirm receipt and send the draft bill for review.\n\nBest regards,'},{id:'T2',name:'Cutoff Extension',subject:'Cutoff Extension – {{booking}}',body:'Dear Documentation Team,\n\nPlease grant an extension for booking {{booking}}.\n\nCurrent SI cutoff: {{si_cutoff}}\nVessel/Voyage: {{vessel}} / {{voyage}}\n\nPlease confirm the latest acceptable submission time.\n\nBest regards,'},{id:'T3',name:'Draft Correction',subject:'Draft Correction – {{booking}}',body:'Dear Documentation Team,\n\nPlease revise the draft bill for booking {{booking}} according to the corrections below:\n\n[Enter corrections]\n\nKindly return a revised draft for final approval.\n\nBest regards,'}]};
let state=load(),screen='shipments',activeShipmentId=null,workspaceTab='summary',activeTemplate='T1',cargoFilter='unassigned';
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x||clone(sample)}catch{return clone(sample)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shipment(id){return state.shipments.find(x=>x.id===id)}function wrs(s){return s.houses.flatMap(h=>h.shippers.flatMap(p=>p.wrs.map(w=>({w,h,p}))))}function totals(s){const a=wrs(s);return{houses:s.houses.length,wrs:a.length,pieces:a.reduce((n,x)=>n+Number(x.w.pieces||0),0),weight:a.reduce((n,x)=>n+Number(x.w.weight||0),0),cbm:a.reduce((n,x)=>n+Number(x.w.cbm||0),0)}}
function missingDocs(w){const req=w.dg?['invoice','packing','sli','sds','imo']:['invoice','packing','sli'];return req.filter(k=>!w.docs[k])}function issues(s){const out=[];wrs(s).forEach(({w,h,p})=>{const m=missingDocs(w);if(m.length)out.push({type:'docs',label:`${w.id} missing ${m.join(', ').toUpperCase()}`,sub:`${h.hbl} · ${p.name}`,wr:w});if(w.handling!=='Complete')out.push({type:'warehouse',label:`${w.handling}: ${w.id}`,sub:`${h.hbl} · ${p.name}`,wr:w});if(['Not loaded','Held'].includes(w.loading))out.push({type:'loading',label:`${w.id} is ${w.loading}`,sub:`${h.hbl} · ${p.name}`,wr:w})});s.houses.forEach(h=>h.shippers.forEach(p=>{if(p.aesStatus!=='Filed')out.push({type:'aes',label:`AES ${p.aesStatus}: ${p.name}`,sub:`${h.hbl} · ${p.wrs.length} WR(s)`})}));return out}
function badge(t){let c='gray';if(/filed|ready|complete|loaded|assigned/i.test(t))c='green';else if(/missing|held|not loaded|unassigned/i.test(t))c='red';else if(/loading|planning|synced/i.test(t))c='blue';else if(/prepare|inspect|repalletize|depalletize|attention/i.test(t))c='amber';return `<span class="pill ${c}">${esc(t)}</span>`}function fmt(d){return d?new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—'}
function render(){document.querySelectorAll('.side button[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===screen));document.getElementById('app').innerHTML=screen==='shipments'?shipmentsView():screen==='cargo'?cargoView():screen==='workspace'?workspaceView():screen==='all-attention'?allAttentionView():templatesView();bind()}
function shipmentsView(){return `<div class="top"><div><h1>Ocean Shipments</h1><p>Start with the booking or weekly consolidation, then work inside it.</p></div><div class="actions"><button class="btn" id="reset">Reset sample</button><button class="btn primary" id="newShipment">+ New shipment</button></div></div><div class="notice"><strong>${state.cargoPool.filter(x=>!x.assignedShipmentId).length} Magaya WRs are waiting to be assigned</strong>Open Cargo on Hand to add them into a weekly consolidation.</div><div class="shipment-list">${state.shipments.map(s=>{const t=totals(s),i=issues(s),done=Math.max(0,100-Math.min(100,i.length*10));return `<div class="card shipment-card"><div class="shipment-title"><div class="week"><div><small>WEEK</small>${s.week}</div></div><div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.booking)} · ${esc(s.carrier)} · ${esc(s.route)}</div><div class="meta">${badge(s.status)}<span class="pill gray">ETD ${esc(s.etd)}</span><span class="pill ${i.length?'amber':'green'}">${i.length} attention</span></div></div></div><div><div class="muted" style="margin-bottom:6px">${t.houses} Houses · ${t.wrs} WRs · ${t.pieces} pieces</div><div class="progress"><span style="width:${done}%"></span></div><div class="muted" style="font-size:11px;margin-top:5px">${done}% operational completion</div></div><button class="btn primary openShipment" data-id="${s.id}">Open shipment</button></div>`}).join('')}</div>`}
function cargoView(){const unassigned=state.cargoPool.filter(x=>!x.assignedShipmentId).length,assigned=state.cargoPool.length-unassigned;let rows=state.cargoPool.filter(x=>cargoFilter==='all'||(cargoFilter==='assigned'?x.assignedShipmentId:!x.assignedShipmentId));return `<div class="top"><div><h1>Cargo on Hand</h1><p>Magaya WR inbox. Sync the report, then assign cargo into the correct shipment.</p></div><div class="sync-line">${badge('Last synced '+fmt(state.lastMagayaSync))}<button class="btn" id="simulateSync">Simulate 2-hour sync</button></div></div><div class="metrics"><div class="metric card"><small>Total cargo on hand</small><strong>${state.cargoPool.length}</strong></div><div class="metric card"><small>Unassigned WRs</small><strong>${unassigned}</strong></div><div class="metric card"><small>Assigned WRs</small><strong>${assigned}</strong></div><div class="metric card"><small>Next report</small><strong>2 hrs</strong></div></div><div class="card panel" style="margin-bottom:14px"><div class="import-box"><h3>Import Magaya Cargo on Hand report</h3><p class="muted">CSV headers supported: WR, Shipper, Consignee, Pieces, Packages, Weight, CBM, Location, Received Date.</p><input type="file" id="csvFile" accept=".csv,text/csv"><div style="margin-top:10px"><button class="btn primary" id="importCsv">Import report</button></div></div></div><div class="card panel"><div class="searchbar"><input id="cargoSearch" placeholder="Search WR, shipper, consignee or location"><select id="cargoFilter"><option value="unassigned" ${cargoFilter==='unassigned'?'selected':''}>Unassigned</option><option value="assigned" ${cargoFilter==='assigned'?'selected':''}>Assigned</option><option value="all" ${cargoFilter==='all'?'selected':''}>All cargo</option></select></div><div class="table-wrap"><table class="summary-table"><thead><tr><th>WR</th><th>Shipper</th><th>Consignee</th><th>Cargo</th><th>Weight</th><th>Location</th><th>Received</th><th>Status / action</th></tr></thead><tbody id="cargoRows">${cargoRows(rows)}</tbody></table></div></div>`}
function cargoRows(rows){return rows.map(c=>`<tr data-cargo-row data-search="${esc((c.id+' '+c.shipper+' '+c.consignee+' '+c.location).toLowerCase())}"><td><strong>${esc(c.id)}</strong></td><td>${esc(c.shipper)}</td><td>${esc(c.consignee)}</td><td>${c.pieces} ${esc(c.packages)}<div class="muted">${Number(c.cbm||0).toFixed(2)} CBM</div></td><td>${Number(c.weight||0).toLocaleString()} lb</td><td>${esc(c.location||'—')}</td><td class="nowrap">${esc(c.received||'—')}</td><td>${c.assignedShipmentId?`${badge('Assigned')}<div class="muted" style="margin-top:5px">Week ${shipment(c.assignedShipmentId)?.week||'—'}</div>`:`<div class="cargo-actions"><select data-assign-select="${c.id}">${state.shipments.map(s=>`<option value="${s.id}">Week ${s.week} · ${esc(s.booking)}</option>`).join('')}</select><button class="btn small primary assignCargo" data-wr="${c.id}">Add</button></div>`}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No cargo matches this view.</td></tr>'}
function assignCargo(wrId,shipmentId){const c=state.cargoPool.find(x=>x.id===wrId),s=shipment(shipmentId);if(!c||!s)return;let h=s.houses.find(x=>x.consignee.trim().toLowerCase()===c.consignee.trim().toLowerCase());if(!h){h={id:'H'+Date.now(),hbl:'Pending',consignee:c.consignee,notify:'Same as consignee',shippers:[]};s.houses.push(h)}let p=h.shippers.find(x=>x.name.trim().toLowerCase()===c.shipper.trim().toLowerCase());if(!p){p={id:'S'+Date.now(),name:c.shipper,aesStatus:'Pending documents',itn:'',wrs:[]};h.shippers.push(p)}if(!p.wrs.some(x=>x.id===c.id))p.wrs.push({id:c.id,pieces:+c.pieces||0,packages:c.packages||'Pieces',weight:+c.weight||0,cbm:+c.cbm||0,location:c.location||'',handling:'Complete',palletHT:false,loading:'Not loaded',dg:false,docs:{invoice:false,packing:false,sli:false,sds:false,imo:false,aes:false},notes:`Imported from Magaya cargo-on-hand report. Received ${c.received||'date not provided'}.`});c.assignedShipmentId=s.id;save();render()}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return[];const split=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out};const head=split(lines[0]).map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,''));const val=(r,names)=>{for(const n of names){const i=head.indexOf(n);if(i>=0)return r[i]||''}return''};return lines.slice(1).map(split).map(r=>({id:val(r,['wr','wrnumber','warehousereceipt','warehousereceiptnumber']),shipper:val(r,['shipper','supplier']),consignee:val(r,['consignee','customer']),pieces:+val(r,['pieces','pcs','quantity'])||0,packages:val(r,['packages','packagetype','package'])||'Pieces',weight:+val(r,['weight','weightlb','grossweight'])||0,cbm:+val(r,['cbm','volume'])||0,location:val(r,['location','warehouselocation']),received:val(r,['receiveddate','date','received']),assignedShipmentId:'',source:'Magaya'})).filter(x=>x.id)}
function mergeCargo(items){let added=0,updated=0;items.forEach(n=>{const e=state.cargoPool.find(x=>x.id.trim().toLowerCase()===n.id.trim().toLowerCase());if(e){const assigned=e.assignedShipmentId;Object.assign(e,n,{assignedShipmentId:assigned});updated++}else{state.cargoPool.push(n);added++}});state.lastMagayaSync=new Date().toISOString();save();alert(`${added} new WR(s) added and ${updated} existing WR(s) refreshed.`);render()}
function workspaceView(){const s=shipment(activeShipmentId);if(!s){screen='shipments';return shipmentsView()}const tabs=[['summary','Master Summary'],['houses','Houses'],['warehouse','Warehouse'],['documents','Documents & AES'],['loading','Loading'],['instructions','Instructions'],['setup','Shipment Setup']];return `<div class="workspace-head card"><div class="workspace-row"><div><button class="btn small ghost" id="backShipments">← Shipments</button><h2 style="margin-top:8px">${esc(s.name)}</h2><div class="muted">Booking ${esc(s.booking)} · ${esc(s.carrier)} · ${esc(s.vessel)} / ${esc(s.voyage)} · ETD ${esc(s.etd)}</div></div><div class="actions">${badge(s.status)}<button class="btn small" id="duplicateShipment">Duplicate next week</button></div></div><div class="tabs">${tabs.map(x=>`<button data-tab="${x[0]}" class="${workspaceTab===x[0]?'active':''}">${x[1]}</button>`).join('')}</div></div>${workspaceTab==='summary'?summaryView(s):workspaceTab==='houses'?housesView(s):workspaceTab==='warehouse'?warehouseView(s):workspaceTab==='documents'?documentsView(s):workspaceTab==='loading'?loadingView(s):workspaceTab==='instructions'?instructionsView(s):setupView(s)}`}
function summaryView(s){const t=totals(s),i=issues(s);return `<div class="metrics">${[['Houses',t.houses],['Warehouse Receipts',t.wrs],['Pieces',t.pieces],['Weight',t.weight.toLocaleString()+' lb']].map(x=>`<div class="metric card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="grid two"><div class="card panel"><h3>Master cargo summary</h3><table class="summary-table"><thead><tr><th>House</th><th>Consignee</th><th>Shippers</th><th>WRs</th><th>Pieces</th><th>Weight</th><th>Status</th></tr></thead><tbody>${s.houses.map(h=>{const hw=h.shippers.flatMap(p=>p.wrs),bad=h.shippers.some(p=>p.aesStatus!=='Filed')||hw.some(w=>missingDocs(w).length||w.handling!=='Complete');return `<tr><td><strong>${h.hbl}</strong></td><td>${esc(h.consignee)}</td><td>${h.shippers.length}</td><td>${hw.length}</td><td>${hw.reduce((n,w)=>n+Number(w.pieces),0)}</td><td>${hw.reduce((n,w)=>n+Number(w.weight),0).toLocaleString()} lb</td><td>${badge(bad?'Attention':'Ready')}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">No Houses yet.</td></tr>'}</tbody></table></div><div class="grid"><div class="card panel"><h3>Needs attention</h3><div class="attention-list">${i.slice(0,8).map(x=>`<div class="attention ${x.type==='docs'||x.type==='aes'?'redline':''}"><div><strong>${esc(x.label)}</strong><small>${esc(x.sub)}</small></div>${x.wr?`<button class="btn small editWr" data-wr="${x.wr.id}">Open</button>`:''}</div>`).join('')||'<div class="muted">Everything is clear.</div>'}</div></div><div class="card panel"><h3>Cutoffs</h3>${Object.entries(s.cutoffs).map(([k,v])=>`<div class="cutoff"><div><strong>${k.toUpperCase()}</strong><span class="muted">${fmt(v)}</span></div>${badge(v&&new Date(v)<new Date()?'Passed':'Upcoming')}</div>`).join('')}</div></div></div>`}
function housesView(s){return `<div class="top"><div><h1 style="font-size:22px">Houses</h1><p>Each House is a consignee shipment; AES is grouped by shipper inside that House.</p></div><button class="btn" onclick="screen='cargo';render()">+ Add WR from Cargo on Hand</button></div><div class="grid">${s.houses.map(h=>`<div class="card house"><div class="house-head"><div><h3>${esc(h.hbl)} · ${esc(h.consignee)}</h3><div class="muted">Notify: ${esc(h.notify)}</div></div><span class="pill gray">${h.shippers.length} shippers</span></div>${h.shippers.map(p=>`<div class="shipper"><div class="shipper-top"><div><strong>${esc(p.name)}</strong><div class="muted">${p.wrs.length} WR(s) · ITN ${esc(p.itn||'not assigned')}</div></div>${badge(p.aesStatus)}</div>${p.wrs.map(w=>`<div class="wr-row"><button class="btn small editWr" data-wr="${w.id}">${w.id}</button><span>${w.pieces} ${esc(w.packages)}</span><span>${w.weight} lb</span><span>${esc(w.location)}</span><div class="docdots">${['invoice','packing','sli','sds','imo'].map(k=>`<span class="dot ${w.docs[k]?'ok':(w.dg||['invoice','packing','sli'].includes(k)?'bad':'')}"></span>`).join('')}</div>${badge(w.loading)}</div>`).join('')}</div>`).join('')}</div>`).join('')||'<div class="card panel muted">No Houses yet. Add WRs from Cargo on Hand.</div>'}</div>`}
function warehouseView(s){const list=wrs(s);return `<div class="grid three">${['Depalletize','Repalletize','Inspect'].map(a=>`<div class="card panel"><h3>${a}</h3><div class="queue">${list.filter(x=>x.w.handling===a).map(x=>queueItem(x)).join('')||'<div class="muted">None</div>'}</div></div>`).join('')}</div><div class="card panel" style="margin-top:14px"><h3>All warehouse receipts</h3><table class="summary-table"><thead><tr><th>WR</th><th>House</th><th>Shipper</th><th>Location</th><th>Handling</th><th>HT pallet</th><th>Loading</th></tr></thead><tbody>${list.map(x=>`<tr><td><button class="btn small editWr" data-wr="${x.w.id}">${x.w.id}</button></td><td>${x.h.hbl}</td><td>${esc(x.p.name)}</td><td>${esc(x.w.location)}</td><td>${badge(x.w.handling)}</td><td>${x.w.palletHT?'Yes':'No'}</td><td>${badge(x.w.loading)}</td></tr>`).join('')}</tbody></table></div>`}function queueItem(x){return `<div class="queue-item"><div><h4>${x.w.id}</h4><div class="muted">${x.h.hbl} · ${esc(x.p.name)} · ${esc(x.w.location)}</div></div><button class="btn small editWr" data-wr="${x.w.id}">Update</button></div>`}
function documentsView(s){return `<div class="card panel"><h3>Shipper filing groups</h3><table class="summary-table"><thead><tr><th>House</th><th>Shipper</th><th>WRs</th><th>Invoices</th><th>SLI</th><th>DG docs</th><th>AES</th><th>ITN</th></tr></thead><tbody>${s.houses.flatMap(h=>h.shippers.map(p=>{const inv=p.wrs.filter(w=>w.docs.invoice).length,sli=p.wrs.filter(w=>w.docs.sli).length,dg=p.wrs.filter(w=>w.dg),dgok=dg.every(w=>w.docs.sds&&w.docs.imo);return `<tr><td>${h.hbl}</td><td><strong>${esc(p.name)}</strong></td><td>${p.wrs.map(w=>w.id).join(', ')}</td><td>${inv}/${p.wrs.length}</td><td>${sli}/${p.wrs.length}</td><td>${dg.length?badge(dgok?'Complete':'Missing'):'N/A'}</td><td>${badge(p.aesStatus)}</td><td>${esc(p.itn||'—')}</td></tr>`})).join('')}</tbody></table></div>`}
function loadingView(s){const list=wrs(s);return `<div class="metrics">${[['Ready',list.filter(x=>x.w.loading==='Ready').length],['Loading',list.filter(x=>x.w.loading==='Loading').length],['Loaded',list.filter(x=>x.w.loading==='Loaded').length],['Not loaded',list.filter(x=>x.w.loading==='Not loaded').length]].map(x=>`<div class="metric card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="card panel"><h3>Loading control</h3><table class="summary-table"><thead><tr><th>Sequence</th><th>WR</th><th>House</th><th>Consignee</th><th>Cargo</th><th>Weight</th><th>Handling</th><th>Status</th></tr></thead><tbody>${list.map((x,n)=>`<tr><td>${n+1}</td><td><button class="btn small editWr" data-wr="${x.w.id}">${x.w.id}</button></td><td>${x.h.hbl}</td><td>${esc(x.h.consignee)}</td><td>${x.w.pieces} ${esc(x.w.packages)}</td><td>${x.w.weight} lb</td><td>${esc(x.w.handling)}</td><td>${badge(x.w.loading)}</td></tr>`).join('')}</tbody></table></div>`}
function instructionsView(s){const t=state.templates.find(x=>x.id===activeTemplate)||state.templates[0],text=fill(t.body,s);return `<div class="instruction-layout"><div class="card template-list"><h3 style="padding:5px 10px">Templates</h3>${state.templates.map(x=>`<button data-template="${x.id}" class="${x.id===t.id?'active':''}">${esc(x.name)}</button>`).join('')}</div><div class="card panel"><div class="actions" style="justify-content:flex-end;margin-bottom:10px"><button class="btn" id="copyInstructions">Copy</button><button class="btn primary" id="emailInstructions">Open email</button></div><div class="field"><label>Subject</label><input id="instructionSubject" value="${esc(fill(t.subject,s))}"></div><div class="output" id="instructionOutput">${esc(text)}</div></div></div>`}
function fill(text,s){const t=totals(s),map={booking:s.booking,carrier:s.carrier,vessel:s.vessel,voyage:s.voyage,route:s.route,etd:s.etd,houses:t.houses,pieces:t.pieces,weight:t.weight.toLocaleString(),cbm:t.cbm.toFixed(2),si_cutoff:fmt(s.cutoffs.si)};return Object.entries(map).reduce((a,[k,v])=>a.replaceAll(`{{${k}}}`,v),text)}
function setupView(s){return `<div class="card panel"><h3>Shipment setup</h3><div class="form-grid">${[['name','Shipment name'],['week','Consolidation week'],['booking','Booking'],['carrier','Carrier'],['route','Route'],['vessel','Vessel'],['voyage','Voyage'],['etd','ETD']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-setup="${k}" value="${esc(s[k])}"></div>`).join('')}${Object.entries(s.cutoffs).map(([k,v])=>`<div class="field"><label>${k.toUpperCase()} cutoff</label><input type="datetime-local" data-cutoff="${k}" value="${esc(v)}"></div>`).join('')}</div><button class="btn primary" id="saveSetup">Save shipment</button></div>`}
function allAttentionView(){const rows=state.shipments.flatMap(s=>issues(s).map(i=>({s,i})));return `<div class="top"><div><h1>All Attention</h1><p>Exceptions across every active shipment.</p></div></div><div class="card panel"><div class="attention-list">${rows.map(({s,i})=>`<div class="attention ${i.type==='docs'||i.type==='aes'?'redline':''}"><div><strong>${esc(i.label)}</strong><small>Week ${s.week} · ${esc(s.booking)} · ${esc(i.sub)}</small></div><button class="btn small jumpShipment" data-id="${s.id}">Open shipment</button></div>`).join('')||'<div class="muted">Nothing needs attention.</div>'}</div></div>`}
function templatesView(){return `<div class="top"><div><h1>Instruction Templates</h1><p>Reusable wording for carriers, routes, draft approvals and cutoff requests.</p></div></div><div class="grid">${state.templates.map(t=>`<div class="card panel"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.subject)}</div><pre style="white-space:pre-wrap;color:#475467">${esc(t.body)}</pre></div>`).join('')}</div>`}
function findWR(id){for(const s of state.shipments)for(const h of s.houses)for(const p of h.shippers){const w=p.wrs.find(x=>x.id===id);if(w)return{s,h,p,w}}}
function openWR(id){const x=findWR(id);if(!x)return;document.getElementById('drawerTitle').textContent=`${x.w.id} · ${x.p.name}`;document.getElementById('drawerBody').innerHTML=`<div class="form-grid"><div class="field"><label>Pieces</label><input id="dPieces" type="number" value="${x.w.pieces}"></div><div class="field"><label>Package type</label><input id="dPackages" value="${esc(x.w.packages)}"></div><div class="field"><label>Weight lb</label><input id="dWeight" type="number" value="${x.w.weight}"></div><div class="field"><label>CBM</label><input id="dCbm" type="number" step=".01" value="${x.w.cbm}"></div><div class="field"><label>Location</label><input id="dLocation" value="${esc(x.w.location)}"></div><div class="field"><label>Warehouse action</label><select id="dHandling">${['Complete','Depalletize','Repalletize','Inspect','Hold'].map(v=>`<option ${x.w.handling===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Loading status</label><select id="dLoading">${['Not loaded','Ready','Loading','Loaded','Partial','Held'].map(v=>`<option ${x.w.loading===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>HT pallet</label><select id="dHT"><option value="false" ${!x.w.palletHT?'selected':''}>No</option><option value="true" ${x.w.palletHT?'selected':''}>Yes</option></select></div><div class="field full"><label>Documents</label><div class="checks">${Object.keys(x.w.docs).map(k=>`<label class="check"><input type="checkbox" data-doc="${k}" ${x.w.docs[k]?'checked':''}> ${k.toUpperCase()}</label>`).join('')}</div></div><div class="field full"><label>Notes</label><textarea id="dNotes" rows="4">${esc(x.w.notes)}</textarea></div></div><button class="btn primary" id="saveWR">Save changes</button>`;document.getElementById('drawer').classList.add('open');document.getElementById('saveWR').onclick=()=>{x.w.pieces=+dPieces.value;x.w.packages=dPackages.value;x.w.weight=+dWeight.value;x.w.cbm=+dCbm.value;x.w.location=dLocation.value;x.w.handling=dHandling.value;x.w.loading=dLoading.value;x.w.palletHT=dHT.value==='true';document.querySelectorAll('[data-doc]').forEach(c=>x.w.docs[c.dataset.doc]=c.checked);x.w.notes=dNotes.value;save();closeDrawer();render()}}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{screen=b.dataset.nav;render()});document.querySelectorAll('.openShipment,.jumpShipment').forEach(b=>b.onclick=()=>{activeShipmentId=b.dataset.id;screen='workspace';workspaceTab='summary';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{workspaceTab=b.dataset.tab;render()});document.querySelectorAll('.editWr').forEach(b=>b.onclick=()=>openWR(b.dataset.wr));document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{activeTemplate=b.dataset.template;render()});document.querySelectorAll('.assignCargo').forEach(b=>b.onclick=()=>assignCargo(b.dataset.wr,document.querySelector(`[data-assign-select="${b.dataset.wr}"]`).value));if(document.getElementById('cargoFilter'))cargoFilter.onchange=e=>{cargoFilter=e.target.value;render()};if(document.getElementById('cargoSearch'))cargoSearch.oninput=e=>document.querySelectorAll('[data-cargo-row]').forEach(r=>r.style.display=r.dataset.search.includes(e.target.value.toLowerCase())?'':'none');if(document.getElementById('importCsv'))importCsv.onclick=()=>{const f=csvFile.files[0];if(!f)return alert('Choose the Magaya CSV report first.');const reader=new FileReader();reader.onload=()=>mergeCargo(parseCSV(reader.result));reader.readAsText(f)};if(document.getElementById('simulateSync'))simulateSync.onclick=()=>{state.lastMagayaSync=new Date().toISOString();save();render()};if(document.getElementById('backShipments'))backShipments.onclick=()=>{screen='shipments';activeShipmentId=null;render()};if(document.getElementById('reset'))reset.onclick=()=>{state=clone(sample);save();render()};if(document.getElementById('copyInstructions'))copyInstructions.onclick=()=>navigator.clipboard.writeText(instructionOutput.textContent);if(document.getElementById('emailInstructions'))emailInstructions.onclick=()=>location.href=`mailto:?subject=${encodeURIComponent(instructionSubject.value)}&body=${encodeURIComponent(instructionOutput.textContent)}`;if(document.getElementById('saveSetup'))saveSetup.onclick=()=>{const s=shipment(activeShipmentId);document.querySelectorAll('[data-setup]').forEach(i=>s[i.dataset.setup]=i.dataset.setup==='week'?+i.value:i.value);document.querySelectorAll('[data-cutoff]').forEach(i=>s.cutoffs[i.dataset.cutoff]=i.value);save();render()};if(document.getElementById('newShipment'))newShipment.onclick=()=>{const week=Math.max(...state.shipments.map(s=>s.week))+1;state.shipments.push({id:'SH'+Date.now(),week,name:`New Consolidation – Week ${week}`,booking:'Pending',carrier:'',route:'Miami → ',vessel:'TBD',voyage:'TBD',etd:'',status:'Planning',cutoffs:{si:'',aes:'',vgm:'',cargo:''},houses:[]});save();render()};if(document.getElementById('duplicateShipment'))duplicateShipment.onclick=()=>{const s=clone(shipment(activeShipmentId));s.id='SH'+Date.now();s.week+=1;s.name=s.name.replace(/Week \d+/i,`Week ${s.week}`);s.booking='Pending';s.status='Planning';s.houses=[];state.shipments.push(s);save();screen='shipments';render()}}
render();
</script>
</body></html>
